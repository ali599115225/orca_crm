name: RF12 Migration Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/rf12-migration-readiness.yml"
      - "docs/product-extension/RENT_FLEX_12_MIGRATION_READINESS_GATE.md"
      - "scripts/rf12-migration-readiness.mjs"
      - "tests/foundation/g8-rent-flex-12-migration-readiness.test.ts"
      - "prisma/migrations/20260816203000_rent_flex_12_persistence_accounting/migration.sql"
      - "prisma/rent-flex-12.prisma"
      - "prisma/rent-flex-12-accounting.prisma"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf12-migration-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRE_RF12_SHA: 7762b851738b4600d6f87edc7b94140b39fc8d9c
  PRE_W1A_MIGRATION: prisma/migrations/20260815001500_w1_contract_finance_foundation/migration.sql
  PRE_W1D_MIGRATION: prisma/migrations/20260815004500_w1d_snapshot_offer_integrity/migration.sql
  PRE_W1_ALIGNMENT_MIGRATION: prisma/migrations/20260815010000_w1_schema_alignment/migration.sql
  RF12_MIGRATION: prisma/migrations/20260816203000_rent_flex_12_persistence_accounting/migration.sql
  POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_rf12mr_admin?sslmode=disable
  UPGRADE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_rf12mr_upgrade?sslmode=disable
  NODE_ENV: test

jobs:
  isolated-upgrade:
    name: PostgreSQL 16 isolated pre-RF12 -> RF12 upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orca_rf12mr_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orca_rf12mr_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 0

      - name: Checkout exact pre-RF12 reference
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRE_RF12_SHA }}
          path: pre
          fetch-depth: 1

      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: head/package-lock.json

      - name: Verify exact refs and isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          candidate="$(git -C head rev-parse HEAD)"
          event_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$candidate" = "$event_head"
          test "$(git -C pre rev-parse HEAD)" = "$PRE_RF12_SHA"
          test ! -e pre/prisma/rent-flex-12.prisma
          test ! -e pre/prisma/rent-flex-12-accounting.prisma
          test -e pre/prisma/w1-contract-finance.prisma
          test -e "pre/$PRE_W1A_MIGRATION"
          test -e "pre/$PRE_W1D_MIGRATION"
          test -e "pre/$PRE_W1_ALIGNMENT_MIGRATION"
          postgres_version="$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version_num' | xargs)"
          test "$postgres_version" -ge 160000 -a "$postgres_version" -lt 170000
          printf 'pre_rf12_sha=%s\nhead_sha=%s\npostgres=%s\n' "$PRE_RF12_SHA" "$candidate" "$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version' | xargs)" | tee evidence/environment.txt

      - name: Install candidate dependencies
        run: npm --prefix head ci

      - name: Static additive migration contract
        shell: bash
        run: |
          set -euo pipefail
          RF12MR_MIGRATION="head/$RF12_MIGRATION" RF12MR_OUTPUT=evidence/static.json node head/scripts/rf12-migration-readiness.mjs static

      - name: Create isolated upgrade database
        run: createdb -h 127.0.0.1 -U postgres orca_rf12mr_upgrade

      - name: Materialize supported pre-RF12 base schema
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$UPGRADE_URL" DIRECT_URL="$UPGRADE_URL" RF12MR_PRE_PRISMA_DIR=pre/prisma RF12MR_HEAD_DIR=head RF12MR_COMBINED_SCHEMA=evidence/pre-rf12-base-schema.prisma RF12MR_OUTPUT=evidence/pre-rf12-base-schema.sql node head/scripts/rf12-migration-readiness.mjs materialize-pre
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f evidence/pre-rf12-base-schema.sql > evidence/pre-rf12-base-apply.txt

      - name: Apply exact pre-RF12 W1 schema migrations
        shell: bash
        run: |
          set -euo pipefail
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "pre/$PRE_W1A_MIGRATION" > evidence/pre-rf12-w1a-apply.txt
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "pre/$PRE_W1D_MIGRATION" > evidence/pre-rf12-w1d-apply.txt
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "pre/$PRE_W1_ALIGNMENT_MIGRATION" > evidence/pre-rf12-w1-alignment-apply.txt

      - name: Capture legacy fingerprint before RF12
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$UPGRADE_URL" RF12MR_OUTPUT=evidence/legacy-before.json node head/scripts/rf12-migration-readiness.mjs capture-before

      - name: Apply RF12 migration to isolated database
        run: psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "head/$RF12_MIGRATION" > evidence/rf12-apply.txt

      - name: Verify exact schema drift and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$UPGRADE_URL" DIRECT_URL="$UPGRADE_URL" RF12MR_HEAD_DIR=head RF12MR_BEFORE=evidence/legacy-before.json RF12MR_DRIFT_OUTPUT=evidence/rf12-drift.txt RF12MR_OUTPUT=evidence/rf12-summary.json node head/scripts/rf12-migration-readiness.mjs verify-upgrade

      - name: RF12 migration readiness contract test
        working-directory: head
        run: npx vitest run tests/foundation/g8-rent-flex-12-migration-readiness.test.ts --reporter=json --outputFile=../evidence/rf12-g8-test-results.json

      - name: Cleanup isolated database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='orca_rf12mr_upgrade' AND pid <> pg_backend_pid()" >/dev/null || true
          dropdb -h 127.0.0.1 -U postgres --if-exists orca_rf12mr_upgrade
          printf '%s\n' '{"verdict":"PASS","isolatedDatabasesRemaining":0}' > evidence/cleanup.json

      - name: Upload RF12 migration readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf12-migration-readiness-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

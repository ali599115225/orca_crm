name: Security Vitest lockfile refresh

on:
  push:
    branches:
      - security/vitest-4.1.11-central-20260911

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/vitest-4.1.11-central-20260911

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Refresh Vitest lockfile only
        run: npm install --package-lock-only --ignore-scripts --save-dev 'vitest@^4.1.11'

      - name: Scope guard
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo 'No dependency changes produced.'
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|package-lock\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit generated dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(deps-dev): bump vitest to 4.1.11'
          git push origin HEAD:security/vitest-4.1.11-central-20260911

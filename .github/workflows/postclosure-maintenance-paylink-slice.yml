name: ORCA Paylink Maintenance Verification
on:
  push:
    branches: [work/orca-postclosure-maintenance-20260813]
    paths: [.github/workflows/postclosure-maintenance-paylink-slice.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed Paylink corrections
        shell: bash
        run: |
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git work/orca-postclosure-r1c-20260813
          git show FETCH_HEAD:lib/payments/providers/paylink.ts > lib/payments/providers/paylink.ts
          git show FETCH_HEAD:app/api/v1/installments/[id]/pay/route.ts > app/api/v1/installments/[id]/pay/route.ts
          git show FETCH_HEAD:tests/payment-providers.test.ts > tests/payment-providers.test.ts
          python3 - <<'PY'
          from pathlib import Path
          for file in ["lib/payments/providers/paylink.ts", "app/api/v1/installments/[id]/pay/route.ts"]:
              p = Path(file)
              s = p.read_text()
              marker = 'function getPaylinkBaseUrl(): string {' if file.startswith('lib/') else 'function createHubPaylinkProvider(input: {'
              guard = '''const PAYLINK_ALLOWED_HOSTS = new Set(["restpilot.paylink.sa", "restapi.paylink.sa"]);\nfunction safePaylinkBaseUrl(value: string): string {\n  const url = new URL(value);\n  if (url.protocol !== "https:" || !PAYLINK_ALLOWED_HOSTS.has(url.hostname.toLowerCase()) || url.username || url.password || url.port || (url.pathname && url.pathname !== "/") || url.search || url.hash) throw new Error("PAYLINK_BASE_URL_NOT_ALLOWED");\n  return url.origin;\n}\n\n'''
              if guard not in s:
                  s = s.replace(marker, guard + marker, 1)
              if file.startswith('lib/'):
                  s = s.replace('return process.env.PAYLINK_BASE_URL || "https://restpilot.paylink.sa";', 'return safePaylinkBaseUrl(process.env.PAYLINK_BASE_URL || "https://restpilot.paylink.sa");', 1)
              else:
                  old = '(input.baseUrl || "https://restpilot.paylink.sa").replace(\n    /\\/+$/,\n    "",\n  )'
                  s = s.replace(old, 'safePaylinkBaseUrl(String(input.baseUrl || ""))', 1)
              p.write_text(s)
          PY
      - run: npm ci
      - run: npx vitest run tests/payment-providers.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Guard scope
        run: |
          ! git diff --name-only 769b0a3de7ff09e00e2baf3c438886a6b616ab1d...HEAD | grep -Eq '^(prisma/schema\.prisma|prisma/migrations/)'
          grep -q 'amount: payment.amountMinorUnits / 100' app/api/v1/installments/[id]/pay/route.ts
          grep -q 'PAYLINK_BASE_URL_NOT_ALLOWED' app/api/v1/installments/[id]/pay/route.ts
      - name: Save verified slice
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/postclosure-maintenance-paylink-slice.yml
          git add -A
          git config user.name "ORCA Maintenance Verification"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(maintenance): correct and constrain Paylink runtime"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:work/orca-postclosure-maintenance-20260813

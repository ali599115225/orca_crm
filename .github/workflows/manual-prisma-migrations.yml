name: Manual Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git branch or commit containing the migration"
        required: true
        default: "main"
        type: string
      expected_migration:
        description: "Expected Prisma migration directory name"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY to apply pending migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-prisma-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-database

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.PRISMA_MIGRATE_DATABASE_URL }}

    steps:
      - name: Verify confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "::error::Confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify migration file
        env:
          MIGRATION_NAME: ${{ inputs.expected_migration }}
        run: |
          if [[ ! "$MIGRATION_NAME" =~ ^[0-9]{14}_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid migration directory name."
            exit 1
          fi

          MIGRATION_FILE="prisma/migrations/$MIGRATION_NAME/migration.sql"

          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "::error::Expected migration file was not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "Verified migration: $MIGRATION_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Show migration status
        continue-on-error: true
        run: npx prisma migrate status

      - name: Deploy pending migrations
        run: npx prisma migrate deploy

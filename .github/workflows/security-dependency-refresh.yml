name: Security dependency refresh

on:
  push:
    branches:
      - work/deepmerge-prisma-security-remediation-20260907
    paths:
      - package.json
      - docs/governance/ORCA_DEPENDENCY_OVERRIDE_REGISTER.json
      - .github/workflows/security-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/deepmerge-prisma-security-remediation-20260907
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Refresh lockfile from declared overrides
        run: |
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          lock.packages[''] = { name: 'orca_crm', ...lock.packages[''] }
          const expected = {
            'node_modules/browserslist': '4.28.9',
            'node_modules/deepmerge-ts': '8.0.1',
            'node_modules/fast-uri': '3.1.7',
            'node_modules/mysql2': '3.24.3'
          }
          for (const [key, version] of Object.entries(expected)) {
            if (lock.packages[key]?.version !== version) {
              console.error(key, lock.packages[key]?.version, '!=', version)
              process.exit(1)
            }
          }
          fs.writeFileSync(path, JSON.stringify(lock, null, 4) + '\n')
          NODE
      - name: Clean install
        run: npm ci
      - name: Production dependency audit
        run: npm run security:audit
      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): refresh audited transitive lockfile"
          git push origin HEAD:work/deepmerge-prisma-security-remediation-20260907

name: ORCA Post-Closure Manual Payment Integrity Verification

on:
  push:
    branches:
      - work/orca-postclosure-maintenance-20260813
    paths:
      - .github/workflows/postclosure-maintenance-manual-payment-slice.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orca-postclosure-maintenance-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed manual-payment integrity remediation
        shell: bash
        run: |
          git fetch --no-tags origin work/orca-postclosure-r1c-20260813
          git show FETCH_HEAD:app/api/v1/invoices/[id]/pay/route.ts > app/api/v1/invoices/[id]/pay/route.ts
          cat > tests/postclosure-maintenance-manual-payment.test.ts <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { describe, expect, it } from "vitest";

          describe("post-closure manual payment integrity", () => {
            it("recovers failed idempotent payments and charges only the remaining minor-unit balance", () => {
              const source = fs.readFileSync(
                path.join(process.cwd(), "app/api/v1/invoices/[id]/pay/route.ts"),
                "utf8",
              );
              expect(source).toContain("state: 'failed' as const");
              expect(source).toContain("paymentTransactionId: transaction.id");
              expect(source).toContain("tx.paymentTransaction.aggregate");
              expect(source).toContain("invoiceTotalMinor");
              expect(source).toContain("paidBeforeMinor");
              expect(source).toContain("remainingMinor");
              expect(source).toContain("amountMinorUnits: created.amountMinorUnits");
              expect(source).toContain("manual payment retry is already in progress");
              expect(source).toContain("payment receipt was not created");
              expect(source).toContain("status: 'FAILED'");
              expect(source).toContain("invoice has no remaining balance");
              expect(source).not.toContain("id: transaction.providerTransactionId");
              expect(source).not.toContain("id: created.paymentTransaction.id,\n        receivedDate: new Date()");
            });
          });
          EOF
      - run: npm ci
      - name: Focused manual-payment tests
        run: npx vitest run tests/phase02-full-closure.test.ts tests/postclosure-maintenance-manual-payment.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Scope guard
        shell: bash
        run: |
          git diff --name-only 769b0a3de7ff09e00e2baf3c438886a6b616ab1d...HEAD | tee /tmp/diff.txt
          if grep -Eq '^(prisma/schema\.prisma|prisma/migrations/)' /tmp/diff.txt; then
            echo 'Forbidden Prisma schema/migration change detected'
            exit 1
          fi
      - name: Commit verified manual-payment slice and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/postclosure-maintenance-manual-payment-slice.yml
          git add -A
          git config user.name "ORCA Maintenance Verification"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(maintenance): harden manual payment idempotency"
          git push origin HEAD:work/orca-postclosure-maintenance-20260813

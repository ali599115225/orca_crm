name: G5 Verified Maintenance

on:
  pull_request:
    branches:
      - work/orca-central-baseline-execution-20260719

permissions:
  contents: write

concurrency:
  group: g5-verified-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Verify and apply
    if: github.event.pull_request.head.ref == 'work/orca-foundation-plan-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-foundation-plan-20260721
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Patch exact reviewed targets
        run: node scripts/g5-verified-maintenance.mjs

      - name: Generate candidate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install candidate tree
        run: npm ci

      - name: Capture candidate evidence
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/g5-candidate-audit.json || true
          npm run typecheck > artifacts/g5-candidate-typecheck.log 2>&1 || true
          cp package.json artifacts/g5-candidate-package.json
          cp package-lock.json artifacts/g5-candidate-package-lock.json

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-candidate-dependencies
          path: |
            artifacts/g5-candidate-audit.json
            artifacts/g5-candidate-typecheck.log
            artifacts/g5-candidate-package.json
            artifacts/g5-candidate-package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Production dependency audit
        run: npm run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Foundation and acceptance tests
        run: |
          npx vitest run tests/foundation/g3-*.test.ts tests/foundation/g4-*.test.ts tests/phase02-full-closure.test.ts
          npm run test:acceptance

      - name: Production build
        run: npm run build

      - name: Remove one-time maintenance files
        run: rm .github/workflows/g5-verified-maintenance.yml scripts/g5-verified-maintenance.mjs

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "orca-foundation-bot"
          git config user.email "orca-foundation-bot@users.noreply.github.com"
          git add package.json package-lock.json \
            lib/payments/providers/paylink.ts \
            components/contracts-payments/ContractsPaymentsCenter.tsx \
            scripts/g5-security-quality-inventory.mjs \
            scripts/g5-verified-maintenance.mjs \
            .github/workflows/g5-verified-maintenance.yml
          git diff --cached --check
          git commit -m "fix(g5): harden dependencies and payment idempotency"
          git push origin HEAD:work/orca-foundation-plan-20260721

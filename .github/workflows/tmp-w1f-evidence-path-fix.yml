name: Temporary W1F evidence path fix

on:
  push:
    branches:
      - work/prisma-deploy-chain-remediation-20260817

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/prisma-deploy-chain-remediation-20260817
          fetch-depth: 0
      - name: Patch only stale W1F evidence paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/w1f-migration-readiness-summary.mjs')
          text = script.read_text()
          old = '''const HISTORICAL_NON_TRANSACTIONAL_PATH = path.join(
            "prisma",
            "migrations",
            HISTORICAL_NON_TRANSACTIONAL_MIGRATION,
            "migration.sql",
          );'''
          new = '''const HISTORICAL_NON_TRANSACTIONAL_PATH = path.join(
            "prisma",
            "migration-evidence",
            "non-production",
            HISTORICAL_NON_TRANSACTIONAL_MIGRATION,
            "migration.sql",
          );'''
          if text.count(old) != 1:
              raise SystemExit('unexpected W1F script match count')
          script.write_text(text.replace(old, new))

          test = Path('tests/foundation/g8-w1f-migration-readiness.test.ts')
          text = test.read_text()
          old = 'join(ROOT, "prisma", "migrations", "20260721020000_g3_rbac_constraints_indexes", "migration.sql")'
          new = 'join(ROOT, "prisma", "migration-evidence", "non-production", "20260721020000_g3_rbac_constraints_indexes", "migration.sql")'
          if text.count(old) != 1:
              raise SystemExit('unexpected W1F test match count')
          test.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- scripts/w1f-migration-readiness-summary.mjs tests/foundation/g8-w1f-migration-readiness.test.ts
          ! grep -Fq 'join(ROOT, "prisma", "migrations", "20260721020000_g3_rbac_constraints_indexes"' tests/foundation/g8-w1f-migration-readiness.test.ts
      - name: Commit exact remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/w1f-migration-readiness-summary.mjs tests/foundation/g8-w1f-migration-readiness.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(prisma): route W1F historical reader to evidence"
          git push origin HEAD:work/prisma-deploy-chain-remediation-20260817

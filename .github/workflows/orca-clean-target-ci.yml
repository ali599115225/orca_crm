name: ORCA Clean Target CI

on:
  pull_request:
  push:
    branches:
      - work/orca-operational-core-cleanroom-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-clean-target-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository governance lint
        run: npm run lint

      - name: Prisma schema validation
        run: npx prisma validate

      - name: Production dependency security audit
        run: npm run security:audit

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Current canonical/domain regression tests
        run: >
          npx vitest run
          tests/foundation/g5-repository-governance-lint.test.ts
          tests/foundation/g5-canonical-staff-placement.test.ts
          tests/foundation/g5-company-branch-canonical-action.test.ts
          tests/foundation/g5-company-organization-canonical-model.test.ts
          tests/foundation/g5-exec-004-organization-authority.test.ts
          tests/foundation/g5-exec-004-organization-service.test.ts
          tests/foundation/g5-customer-identity-canonical-authority.test.ts
          tests/foundation/g5-unit-commitment-canonical-authority.test.ts
          tests/foundation/g5-offer-security-canonical-authority.test.ts
          tests/foundation/g5-contract-signature-evidence.test.ts
          tests/foundation/g5-signed-contract-snapshot.test.ts
          tests/foundation/g5-runtime-contract-followup.test.ts
          tests/foundation/contract-functional-batch4.test.ts
          tests/foundation/g5-final-persistence-readiness.test.ts
          tests/rental/payment-allocation-contract.test.ts
          tests/rental/rental-closure-contract.test.ts
          tests/rental/rental-lifecycle-api-wiring.test.ts
          tests/foundation/g5-dashboard-units-readonly.test.ts

      - name: Production build
        run: npm run build

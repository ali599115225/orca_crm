name: ORCA Production Audit Diagnostic

on:
  pull_request:
    branches:
      - work/orca-z7-audit-diagnostic-base-20260725
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'work/orca-z7-audit-diagnostic-control-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Capture production audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit.json
          code=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const out = {
            auditReportVersion: data.auditReportVersion,
            metadata: data.metadata,
            vulnerabilities: Object.fromEntries(Object.entries(data.vulnerabilities || {}).map(([name,v]) => [name, {
              name: v.name,
              severity: v.severity,
              isDirect: v.isDirect,
              via: v.via,
              effects: v.effects,
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable
            }]))
          };
          console.log(JSON.stringify(out,null,2));
          NODE
          exit "$code"

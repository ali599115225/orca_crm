name: ORCA Security Audit Diagnostic

on:
  push:
    branches:
      - work/orca-security-advisory-20260724-z1-unblock
    paths:
      - .github/workflows/orca-security-audit-diagnostic.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: orca-security-audit-diagnostic-20260724
  cancel-in-progress: true

jobs:
  audit:
    name: Refresh lock and capture production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-security-advisory-20260724-z1-unblock

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Capture production audit
        shell: bash
        run: npm audit --omit=dev --json > ORCA_SECURITY_AUDIT_DIAGNOSTIC.json || true

      - name: Commit generated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json ORCA_SECURITY_AUDIT_DIAGNOSTIC.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(security): refresh lock and audit diagnostic"
          git push origin HEAD:work/orca-security-advisory-20260724-z1-unblock

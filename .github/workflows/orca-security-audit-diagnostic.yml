name: ORCA Security Audit Diagnostic

on:
  push:
    branches:
      - work/orca-security-advisory-20260724-z1-unblock
    paths:
      - .github/workflows/orca-security-audit-diagnostic.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: orca-security-audit-diagnostic-20260724
  cancel-in-progress: true

jobs:
  audit:
    name: Capture production audit JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-security-advisory-20260724-z1-unblock

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Capture production audit
        shell: bash
        run: npm audit --omit=dev --json > ORCA_SECURITY_AUDIT_DIAGNOSTIC.json || true

      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ORCA_SECURITY_AUDIT_DIAGNOSTIC.json
          git commit -m "chore(security): capture audit diagnostic"
          git push origin HEAD:work/orca-security-advisory-20260724-z1-unblock

name: Security full npm audit

on:
  push:
    branches:
      - security/full-npm-audit-20260911

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/full-npm-audit-20260911

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependency graph without scripts
        run: npm ci --ignore-scripts

      - name: Explain vulnerable dependency chains
        shell: bash
        run: |
          echo '=== UNDICI ==='
          npm explain undici || true
          echo '=== ESBUILD ==='
          npm explain esbuild || true

      - name: Full dependency audit including devDependencies
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          code=$?
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('AUDIT_COUNTS=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          const vulns = audit.vulnerabilities ?? {};
          for (const [name, info] of Object.entries(vulns)) {
            console.log(`AUDIT_ITEM name=${name} severity=${info.severity} direct=${Boolean(info.isDirect)} range=${info.range ?? ''} fix=${JSON.stringify(info.fixAvailable ?? null)} effects=${JSON.stringify(info.effects ?? [])}`);
          }
          NODE
          exit $code

name: EXEC-010 Migration Validation

on:
  pull_request:
    paths:
      - ".github/workflows/exec-010-migration-validation.yml"
      - "docs/zero-based/Z8/ORCA_Z8_EXEC_010_*.md"
      - "lib/document-governance/**"
      - "prisma/migrations/20260811080000_exec_010_document_privacy_reporting_controls/migration.sql"
      - "tests/foundation/g5-exec-010-*.test.ts"
      - "scripts/exec-010-postgres-integrity.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exec-010-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PostgreSQL 16 disposable document/privacy/reporting integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orca_exec010
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d orca_exec010"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_exec010?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_exec010?sslmode=disable
      PGPASSWORD: postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify schema and client
        run: |
          npx prisma validate
          npx prisma generate
      - name: Build disposable baseline schema
        run: |
          mkdir -p artifacts
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output artifacts/exec010-baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/exec010-baseline.sql
      - name: Apply single EXEC-010 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260811080000_exec_010_document_privacy_reporting_controls/migration.sql
      - name: Execute PostgreSQL integrity and concurrency probe
        env:
          EXEC010_POSTGRES_EVIDENCE_PATH: artifacts/exec010-postgres-evidence.json
        run: node scripts/exec-010-postgres-integrity.mjs
      - name: Static and focused EXEC-010 gates
        env:
          EXEC010_POSTGRES_EVIDENCE: artifacts/exec010-postgres-evidence.json
        run: |
          npm run lint
          npm run typecheck
          npx vitest run tests/foundation/g5-exec-010-document-governance.test.ts tests/foundation/g5-exec-010-schema-contract.test.ts tests/foundation/g5-exec-010-postgres-contract.test.ts
          npx vitest run tests/foundation/g5-exec-004-organization-authority.test.ts tests/foundation/g5-exec-005-customer-identity-lifecycle.test.ts tests/foundation/g5-exec-006-schema-contract.test.ts tests/foundation/g5-exec-007-schema-contract.test.ts
          npm run security:audit
          npm run build
      - name: Upload EXEC-010 database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exec-010-migration-validation-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

name: ORCA Post-Closure Maintenance R1 Clean

on:
  push:
    branches:
      - work/orca-postclosure-maintenance-20260813
    paths:
      - .github/workflows/postclosure-maintenance-r1-clean.yml

permissions:
  contents: write

concurrency:
  group: orca-postclosure-maintenance-r1-clean
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/orca-postclosure-maintenance-20260813
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reapply verified R1 evidence without migrations
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=a6064ee130d0b33c3aafb6f7a16e07537fb8e190
          git fetch origin "$EVIDENCE" --no-tags
          files=(
            'app/actions/helpdesk.ts'
            'app/api/properties/route.ts'
            'app/api/v1/installments/[id]/pay/route.ts'
            'app/api/v1/invoices/[id]/pay/route.ts'
            'app/api/v1/support/tickets/[id]/reply/route.ts'
            'app/api/v1/tasks/[id]/complete/route.ts'
            'lib/audit.ts'
            'lib/domain/transaction-spine/accept-offer.ts'
            'lib/email.ts'
            'lib/marketing/provider-adapter.ts'
            'lib/notifications.ts'
            'lib/payments/providers/custom-payment.ts'
            'lib/payments/providers/ngenius.ts'
            'lib/payments/providers/paylink.ts'
            'lib/revenue-integrity/trust-gates.ts'
            'lib/saudi-trust-gate/index.ts'
            'lib/support/ticket-destination.ts'
            'tests/dedicated-helpdesk.test.ts'
            'tests/email-admin-alert.test.ts'
            'tests/marketing-campaign-actions.test.ts'
            'tests/offer-unit-integrity.test.ts'
            'tests/payment-providers.test.ts'
            'tests/postclosure-r1-remediation.test.ts'
            'tests/support-operational-closure.test.ts'
            'tests/tasks-operational-closure.test.ts'
          )
          for path in "${files[@]}"; do
            git show "$EVIDENCE:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Task: pin the assignee observed before the atomic transition.
          replace_once(
              'app/api/v1/tasks/[id]/complete/route.ts',
              '            assignedTo: { not: session.userId },',
              '            assignedTo: task.assignedTo,',
          )

          # Existing-contract offer acceptance: return the updated scalar state while preserving loaded relations.
          replace_once(
              'lib/domain/transaction-spine/accept-offer.ts',
              '''        if (offer.status !== OFFER_STATUS.ACCEPTED) {\n          await tx.offer.update({\n            where: { id: offer.id },\n            data: { status: OFFER_STATUS.ACCEPTED, updatedBy: userId },\n          });\n        }\n\n        await tx.offer.updateMany({''',
              '''        let acceptedOffer = offer;\n        if (offer.status !== OFFER_STATUS.ACCEPTED) {\n          const updatedOffer = await tx.offer.update({\n            where: { id: offer.id },\n            data: { status: OFFER_STATUS.ACCEPTED, updatedBy: userId },\n          });\n          acceptedOffer = { ...offer, ...updatedOffer };\n        }\n\n        await tx.offer.updateMany({''',
          )
          replace_once(
              'lib/domain/transaction-spine/accept-offer.ts',
              '''        return {\n          offer,\n          contract: offer.contract,\n          paymentPlan,\n          idempotent: true,\n        };''',
              '''        return {\n          offer: acceptedOffer,\n          contract: offer.contract,\n          paymentPlan,\n          idempotent: true,\n        };''',
          )

          # Custom payment: surface response stream failures and premature close.
          replace_once(
              'lib/payments/providers/custom-payment.ts',
              '''      (response) => {\n        const chunks: Buffer[] = [];\n        let size = 0;''',
              '''      (response) => {\n        const chunks: Buffer[] = [];\n        let size = 0;\n        response.once("error", reject);\n        response.once("close", () => {\n          if (!response.readableEnded) {\n            reject(new Error("CUSTOM_PAYMENT_RESPONSE_CLOSED_EARLY"));\n          }\n        });''',
          )

          # Trust gates: use the existing public-HTTPS/DNS guard instead of a database migration.
          replace_once(
              'lib/revenue-integrity/trust-gates.ts',
              'import { appendRevenueEvent } from "./events";',
              'import { appendRevenueEvent } from "./events";\nimport { requirePublicProviderUrl } from "@/lib/payments/providers/custom-payment";',
          )
          replace_once(
              'lib/revenue-integrity/trust-gates.ts',
              '''const DIALOG360_ALLOWED_HOSTS = new Set([\n  "waba-v2.360dialog.io",\n  "waba-sandbox.360dialog.io",\n]);''',
              '''const DIALOG360_ALLOWED_HOSTS = new Set([\n  "waba-v2.360dialog.io",\n  "waba-sandbox.360dialog.io",\n]);\nconst PAYLINK_ALLOWED_HOSTS = ["restpilot.paylink.sa", "restapi.paylink.sa"] as const;\nconst NGENIUS_ALLOWED_HOSTS = ["api-gateway.ngenius-payments.com"] as const;''',
          )
          replace_once(
              'lib/revenue-integrity/trust-gates.ts',
              '''  if (provider === "PAYLINK") {\n    const apiId = providerValue(credentials, "apiId");\n    const secretKey = providerValue(credentials, "secretKey");\n    if (!apiId || !secretKey) throw new Error("PAYLINK_API_ID_AND_SECRET_REQUIRED");\n    const response = await fetch(`${baseUrl || "https://restpilot.paylink.sa"}/api/auth`, {''',
              '''  if (provider === "PAYLINK") {\n    const apiId = providerValue(credentials, "apiId");\n    const secretKey = providerValue(credentials, "secretKey");\n    if (!apiId || !secretKey) throw new Error("PAYLINK_API_ID_AND_SECRET_REQUIRED");\n    const providerUrl = await requirePublicProviderUrl(\n      String(baseUrl || "https://restpilot.paylink.sa").trim(),\n      PAYLINK_ALLOWED_HOSTS,\n    );\n    const response = await fetch(new URL("/api/auth", providerUrl), {''',
          )
          replace_once(
              'lib/revenue-integrity/trust-gates.ts',
              '''  if (provider === "NGENIUS") {\n    const apiKey = providerValue(credentials, "apiKey");\n    const outletId = providerValue(credentials, "outletId");\n    if (!apiKey || !outletId) throw new Error("NGENIUS_API_KEY_AND_OUTLET_REQUIRED");\n    const response = await fetch(`${baseUrl || "https://api-gateway.ngenius-payments.com"}/identity/auth/access-token`, {''',
              '''  if (provider === "NGENIUS") {\n    const apiKey = providerValue(credentials, "apiKey");\n    const outletId = providerValue(credentials, "outletId");\n    if (!apiKey || !outletId) throw new Error("NGENIUS_API_KEY_AND_OUTLET_REQUIRED");\n    const providerUrl = await requirePublicProviderUrl(\n      String(baseUrl || "https://api-gateway.ngenius-payments.com").trim(),\n      NGENIUS_ALLOWED_HOSTS,\n    );\n    const response = await fetch(new URL("/identity/auth/access-token", providerUrl), {''',
          )

          # Runtime getters must not return an unvalidated payment-provider URL.
          first = '''  if (\n    provider === "PAYLINK" &&\n    (!providerValue(credentials, "apiId") ||\n      !providerValue(credentials, "secretKey"))\n  ) {\n    throw new Error("PAYLINK_API_ID_AND_SECRET_REQUIRED");\n  }\n\n  return {\n    connectionId: connection.id,\n    tenantId: connection.tenantId,\n    provider,\n    baseUrl: connection.baseUrl,\n    credentials,\n  };'''
          first_new = '''  if (\n    provider === "PAYLINK" &&\n    (!providerValue(credentials, "apiId") ||\n      !providerValue(credentials, "secretKey"))\n  ) {\n    throw new Error("PAYLINK_API_ID_AND_SECRET_REQUIRED");\n  }\n\n  let runtimeBaseUrl = connection.baseUrl;\n  if (provider === "PAYLINK") {\n    runtimeBaseUrl = (await requirePublicProviderUrl(\n      String(connection.baseUrl || "https://restpilot.paylink.sa").trim(),\n      PAYLINK_ALLOWED_HOSTS,\n    )).origin;\n  } else if (provider === "NGENIUS") {\n    runtimeBaseUrl = (await requirePublicProviderUrl(\n      String(connection.baseUrl || "https://api-gateway.ngenius-payments.com").trim(),\n      NGENIUS_ALLOWED_HOSTS,\n    )).origin;\n  }\n\n  return {\n    connectionId: connection.id,\n    tenantId: connection.tenantId,\n    provider,\n    baseUrl: runtimeBaseUrl,\n    credentials,\n  };'''
          replace_once('lib/revenue-integrity/trust-gates.ts', first, first_new)

          second = '''  if (provider === "CUSTOM_PAYMENT") {\n    validateCustomPaymentCredentials(\n      connection.baseUrl,\n      credentials,\n    );\n  }\n\n  return {\n    connectionId: connection.id,\n    tenantId: connection.tenantId,\n    provider,\n    baseUrl: connection.baseUrl,\n    credentials,\n  };'''
          second_new = '''  if (provider === "CUSTOM_PAYMENT") {\n    validateCustomPaymentCredentials(\n      connection.baseUrl,\n      credentials,\n    );\n  }\n\n  let runtimeBaseUrl = connection.baseUrl;\n  if (provider === "PAYLINK") {\n    runtimeBaseUrl = (await requirePublicProviderUrl(\n      String(connection.baseUrl || "https://restpilot.paylink.sa").trim(),\n      PAYLINK_ALLOWED_HOSTS,\n    )).origin;\n  } else if (provider === "NGENIUS") {\n    runtimeBaseUrl = (await requirePublicProviderUrl(\n      String(connection.baseUrl || "https://api-gateway.ngenius-payments.com").trim(),\n      NGENIUS_ALLOWED_HOSTS,\n    )).origin;\n  }\n\n  return {\n    connectionId: connection.id,\n    tenantId: connection.tenantId,\n    provider,\n    baseUrl: runtimeBaseUrl,\n    credentials,\n  };'''
          replace_once('lib/revenue-integrity/trust-gates.ts', second, second_new)

          # Validate Paylink/N-Genius before storing even though live verification remains the CONNECTED gate.
          replace_once(
              'lib/revenue-integrity/trust-gates.ts',
              '''  if (provider === "DIALOG360") {\n    validateDialog360Credentials(input.baseUrl, input.credentials);\n  }\n  const encryptedCredentials = encryptCredentials(input.credentials);''',
              '''  if (provider === "DIALOG360") {\n    validateDialog360Credentials(input.baseUrl, input.credentials);\n  }\n  if (provider === "PAYLINK") {\n    await requirePublicProviderUrl(\n      String(input.baseUrl || "https://restpilot.paylink.sa").trim(),\n      PAYLINK_ALLOWED_HOSTS,\n    );\n  }\n  if (provider === "NGENIUS") {\n    await requirePublicProviderUrl(\n      String(input.baseUrl || "https://api-gateway.ngenius-payments.com").trim(),\n      NGENIUS_ALLOWED_HOSTS,\n    );\n  }\n  const encryptedCredentials = encryptCredentials(input.credentials);''',
          )

          # Contract tests: no migration evidence; lock runtime URL guard and exact task assignment snapshot.
          p = Path('tests/postclosure-r1-remediation.test.ts')
          text = p.read_text(encoding='utf-8')
          start = text.index('  it("constrains stored Paylink base URLs to official HTTPS origins"')
          end = text.index('\n\n  it("recovers failed manual-payment', start)
          replacement = '''  it("guards Paylink and N-Genius base URLs in runtime code without a schema change", () => {\n    const trust = source("lib/revenue-integrity/trust-gates.ts");\n    expect(trust).toContain("requirePublicProviderUrl");\n    expect(trust).toContain("restpilot.paylink.sa");\n    expect(trust).toContain("restapi.paylink.sa");\n    expect(trust).toContain("api-gateway.ngenius-payments.com");\n    expect(trust).toContain("PAYLINK_ALLOWED_HOSTS");\n    expect(trust).toContain("NGENIUS_ALLOWED_HOSTS");\n  });'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'expect(task).toContain(\'assignedTo: { not: session.userId }\');',
              'expect(task).toContain("assignedTo: task.assignedTo");',
          )
          p.write_text(text, encoding='utf-8')

          # Add source-level contracts for the two final review findings.
          insert_at = text.rfind('\n});')
          extra = '''\n\n  it("returns the accepted offer state on the existing-contract idempotent path", () => {\n    const offer = source("lib/domain/transaction-spine/accept-offer.ts");\n    expect(offer).toContain("let acceptedOffer = offer");\n    expect(offer).toContain("offer: acceptedOffer");\n  });\n\n  it("rejects custom-provider response stream errors and premature close", () => {\n    const provider = source("lib/payments/providers/custom-payment.ts");\n    expect(provider).toContain('response.once("error", reject)');\n    expect(provider).toContain('CUSTOM_PAYMENT_RESPONSE_CLOSED_EARLY');\n  });'''
          text = p.read_text(encoding='utf-8')
          insert_at = text.rfind('\n});')
          p.write_text(text[:insert_at] + extra + text[insert_at:], encoding='utf-8')
          PY

          # Guardrails: explicitly prove forbidden paths were not introduced.
          test ! -e prisma/migrations/20260813174500_paylink_provider_url_guard/migration.sql
          test ! -e prisma/migrations/20260813174600_validate_paylink_provider_url_guard/migration.sql
          git diff -- prisma/schema.prisma | grep -q '^$' || { echo 'PRISMA_SCHEMA_CHANGE_FORBIDDEN'; exit 1; }
          echo R1_CLEAN_REAPPLIED

      - name: Install
        run: npm ci

      - name: Focused remediation tests
        run: >-
          npx vitest run
          tests/postclosure-r1-remediation.test.ts
          tests/dedicated-helpdesk.test.ts
          tests/support-operational-closure.test.ts
          tests/tasks-operational-closure.test.ts
          tests/email-admin-alert.test.ts
          tests/marketing-campaign-actions.test.ts
          tests/offer-unit-integrity.test.ts
          tests/payment-providers.test.ts
          tests/revenue-integrity/ejar-e2e.test.ts
          tests/p0-tenant-route-isolation.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff integrity and forbidden-scope check
        shell: bash
        run: |
          git diff --check
          git diff --name-only | tee /tmp/changed.txt
          ! grep -Eq '^prisma/schema\.prisma$|^prisma/migrations/' /tmp/changed.txt
          ! grep -Eq '^\.coderabbit\.yaml$|^\.github/workflows/r1c-' /tmp/changed.txt

      - name: Commit verified product remediation and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f .github/workflows/postclosure-maintenance-r1-clean.yml
          git add -A
          git diff --cached --check
          git config user.name "ORCA Maintenance Verification"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(maintenance): remediate confirmed post-closure findings"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:work/orca-postclosure-maintenance-20260813

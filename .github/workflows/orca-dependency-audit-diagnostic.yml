name: ORCA Dependency Audit Diagnostic

on:
  pull_request:
    branches:
      - work/orca-zero-based-execution-20260721
    paths:
      - .github/workflows/orca-dependency-audit-diagnostic.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  audit:
    name: Capture production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Capture audit evidence
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=moderate --json > artifacts/production-dependency-audit.json
          audit_status=$?
          set -e
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/production-dependency-audit.json', 'utf8'));
          const rows = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: Boolean(item.isDirect),
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via ?? []).map((entry) => typeof entry === 'string'
              ? entry
              : { source: entry.source, title: entry.title, severity: entry.severity, range: entry.range, url: entry.url }),
          }));
          console.log('ORCA_AUDIT_METADATA=' + JSON.stringify(report.metadata ?? {}));
          console.log('ORCA_AUDIT_VULNERABILITIES=' + JSON.stringify(rows));
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-production-dependency-audit-diagnostic
          path: artifacts/production-dependency-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce audit result
        shell: bash
        run: exit "${{ steps.audit.outputs.exit_code }}"

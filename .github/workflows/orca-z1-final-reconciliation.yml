name: ORCA Z1 Final Documentation Reconciliation

on:
  push:
    branches:
      - work/orca-z1-business-discovery-20260721
    paths:
      - .github/workflows/orca-z1-final-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: orca-z1-final-documentation-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Apply one atomic Z1 documentation reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Z1 branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-z1-business-discovery-20260721

      - name: Reconcile ledger and closure
        shell: python
        run: |
          from pathlib import Path
          import json

          central_sha = "2029c592ee4fc7133267c38c45b4b0b870692618"
          z1_parent_sha = "8957b0722710795dac6c436fe78fe6c018131f32"

          ledger_path = Path("docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json")
          ledger = ledger_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  "zeroBasedCentralSha": "d3bd565fd1d1f5df484814556c056765d45b392a",',
                  f'  "zeroBasedCentralSha": "{central_sha}",',
              ),
              (
                  '  "currentGate": "Z1_FINAL_EXTERNAL_VALIDATION_BEFORE_CENTRAL_MERGE",',
                  '  "currentGate": "Z1_FINAL_HEAD_VALIDATION_BEFORE_CENTRAL_MERGE",',
              ),
              (
                  '      "status": "OPEN",\n      "affectedPullRequests": [75],\n      "scope": "FINAL_HEAD_PREVIEW_ONLY",\n      "policy": "HOURLY_CONDITION_WATCH; APPLY_ONE_REAL_DOCUMENTATION_RECONCILIATION_WHEN_CAPACITY_IS_AVAILABLE; NO_EMPTY_RETRY; NO_RED_CHECK_BYPASS"',
                  '      "status": "RESOLVED",\n      "affectedPullRequests": [75],\n      "scope": "FINAL_HEAD_PREVIEW_ONLY",\n      "policy": "NO_EMPTY_RETRY; NO_RED_CHECK_BYPASS",\n      "resolution": "VERCEL_CAPACITY_AVAILABLE; FINAL_HEAD_REVALIDATION_STARTED",\n      "resolvedOn": "2026-07-24"',
              ),
              (
                  '  },\n  "stages": [',
                  '  },\n  "latestSecurityUnblocker": {\n    "pullRequest": 79,\n    "branch": "work/orca-security-advisory-20260724-z1-unblock",\n    "finalHeadSha": "64707cf63ed6f1f0f8b9da862e4bde7a1127e8e1",\n    "scope": ["package.json", "package-lock.json", "tests/foundation/g5-security-quality.test.ts"],\n    "advisories": ["Next.js <=16.2.10", "find-my-way <=9.6.0", "valibot <=1.4.1"],\n    "orcaCi": "SUCCESS",\n    "productionDependencyAudit": "SUCCESS / ZERO VULNERABILITIES",\n    "vercel": "READY",\n    "merged": true,\n    "centralMergeSha": "2029c592ee4fc7133267c38c45b4b0b870692618",\n    "runtimeChanged": false,\n    "databaseChanged": false,\n    "productionAction": false\n  },\n  "stages": [',
              ),
              (
                  '      "status": "PASS / CLOSED IN STAGE — CENTRAL MERGE REQUIRES FINAL GREEN VERCEL",',
                  '      "status": "PASS / CLOSED IN STAGE — FINAL HEAD VALIDATION REQUIRED BEFORE CENTRAL MERGE",',
              ),
              (
                  '      "baseCentralSha": "d3bd565fd1d1f5df484814556c056765d45b392a",',
                  f'      "baseCentralSha": "{central_sha}",',
              ),
              (
                  '      "stageHeadShaBeforeFinalDocumentationReconciliation": "ffd369ca5592b016e039af12c3b05759cd4e2788",\n      "preparedClosureBlob": "56ad593461cb11dbc2ade831743ab499366276bb",',
                  f'      "stageHeadShaBeforeFinalDocumentationReconciliation": "{z1_parent_sha}",\n      "closureDocumentBlobBeforeFinalReconciliation": "56ad593461cb11dbc2ade831743ab499366276bb",',
              ),
              (
                  '        "orcaCi": "SUCCESS",\n        "vercel": "BLOCKED_EXTERNAL_BUILD_RATE_LIMIT",\n        "mergeAllowed": false',
                  '        "orcaCi": "PENDING_FINAL_RECONCILED_HEAD",\n        "vercel": "PENDING_FINAL_RECONCILED_HEAD",\n        "mergeAllowed": false',
              ),
              (
                  '      "nextAction": "APPLY_PREPARED_CLOSURE_AND_SCHEMA_VERSION_6_LEDGER_ON_ONE REAL COMMIT WHEN VERCEL CAPACITY IS AVAILABLE"',
                  '      "nextAction": "RUN ORCA CI AND VERCEL ON THE FINAL RECONCILED HEAD; MERGE PR 75 ONLY IF BOTH PASS"',
              ),
          ]

          for old, new in replacements:
              count = ledger.count(old)
              if count != 1:
                  raise SystemExit(f"Ledger replacement expected once, found {count}: {old[:80]}")
              ledger = ledger.replace(old, new, 1)

          json.loads(ledger)
          ledger_path.write_text(ledger, encoding="utf-8")

          closure_path = Path("docs/zero-based/Z1/ORCA_Z1_BUSINESS_DISCOVERY_GATE_CLOSURE.md")
          closure = closure_path.read_text(encoding="utf-8")
          closure_replacements = [
              ("- **Version:** 1.2 — Security Base Reconciliation", "- **Version:** 1.3 — Final Security and Validation Reconciliation"),
              ("- **Date:** 2026-07-22", "- **Date:** 2026-07-24"),
              ("- **Parent central SHA:** `d3bd565fd1d1f5df484814556c056765d45b392a`", f"- **Parent central SHA:** `{central_sha}`"),
              ("- **Security unblocker:** `PR #76 / merged as d3bd565fd1d1f5df484814556c056765d45b392a`", "- **Security unblockers:** `PR #76 / merged as d3bd565fd1d1f5df484814556c056765d45b392a`; `PR #79 / merged as 2029c592ee4fc7133267c38c45b4b0b870692618`"),
              ("- Security advisory unblocker PR #76 passed ORCA CI, dependency audit, recovery/build evidence, and final-head Vercel Preview.\n- PR #76 is merged into the zero-based central branch as `d3bd565fd1d1f5df484814556c056765d45b392a`.", "- Historical security unblocker PR #76 passed its required gates and merged as `d3bd565fd1d1f5df484814556c056765d45b392a`.\n- Latest security unblocker PR #79 passed ORCA CI, zero-vulnerability production audit, TypeScript, G5–G8 tests, regressions, acceptance tests, recovery drill, build, and Vercel.\n- PR #79 is merged into the zero-based central branch as `2029c592ee4fc7133267c38c45b4b0b870692618`."),
              ("This revision aligns the Z1 closure record with the security-unblocked central base. It does not change the Z1 business contract. Central merge still requires ORCA CI and Vercel to be green on this exact final documentation head. No Runtime, database, provider, environment, `main`, or Production action is introduced.", "This revision aligns the Z1 closure record with the actual central head `2029c592ee4fc7133267c38c45b4b0b870692618`, including merged security unblocker PR #79. The PR scope remains exactly six documentation files. Z1 remains closed in stage, while owner decisions and requirements explicitly marked as open remain carried forward without invention. Central merge still requires ORCA CI and Vercel to be green on this exact final reconciled documentation head. No Runtime, database, provider, environment, `main`, or Production action is introduced."),
              ("SECURITY-UNBLOCKED CENTRAL BASE: RECONCILED", "SECURITY-UNBLOCKED CENTRAL BASE: RECONCILED TO 2029c592ee4fc7133267c38c45b4b0b870692618"),
              ("CENTRAL MERGE: REQUIRES FINAL-HEAD GREEN CHECKS", "Z1 PR SCOPE: SIX DOCUMENTATION FILES ONLY\nCENTRAL MERGE: REQUIRES ORCA CI + VERCEL PASS ON FINAL RECONCILED HEAD"),
          ]

          for old, new in closure_replacements:
              count = closure.count(old)
              if count != 1:
                  raise SystemExit(f"Closure replacement expected once, found {count}: {old[:80]}")
              closure = closure.replace(old, new, 1)

          closure_path.write_text(closure, encoding="utf-8")

      - name: Verify reconciliation scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json docs/zero-based/Z1/ORCA_Z1_BUSINESS_DISCOVERY_GATE_CLOSURE.md "
          python -m json.tool docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json >/dev/null

      - name: Commit one final Z1 reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json docs/zero-based/Z1/ORCA_Z1_BUSINESS_DISCOVERY_GATE_CLOSURE.md
          git commit -m "docs(z1): reconcile final central base and validation"
          git push origin HEAD:work/orca-z1-business-discovery-20260721

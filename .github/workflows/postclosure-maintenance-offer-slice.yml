name: ORCA Post-Closure Offer Slice Verification

on:
  push:
    branches:
      - work/orca-postclosure-maintenance-20260813
    paths:
      - .github/workflows/postclosure-maintenance-offer-slice.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orca-postclosure-maintenance-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow offer remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/domain/transaction-spine/accept-offer.ts')
          text = p.read_text(encoding='utf-8')
          old = '''        if (offer.status !== OFFER_STATUS.ACCEPTED) {
          await tx.offer.update({
            where: { id: offer.id },
            data: { status: OFFER_STATUS.ACCEPTED, updatedBy: userId },
          });
        }

        return {
          offer,
          contract: offer.contract,
          paymentPlan,
          idempotent: true,
        };'''
          new = '''        let returnedOffer = offer;
        if (offer.status !== OFFER_STATUS.ACCEPTED) {
          const updatedOffer = await tx.offer.update({
            where: { id: offer.id },
            data: { status: OFFER_STATUS.ACCEPTED, updatedBy: userId },
          });
          returnedOffer = { ...offer, ...updatedOffer };
        }

        await tx.offer.updateMany({
          where: {
            tenantId,
            unitId: offer.unitId,
            id: { not: offer.id },
            status: {
              in: [
                OFFER_STATUS.PENDING,
                OFFER_STATUS.SENT,
                OFFER_STATUS.NEGOTIATION,
              ],
            },
          },
          data: {
            status: OFFER_STATUS.CANCELLED,
            updatedBy: userId,
            auditLog: `Superseded by accepted offer ${offer.id}`,
          },
        });

        return {
          offer: returnedOffer,
          contract: offer.contract,
          paymentPlan,
          idempotent: true,
        };'''
          if text.count(old) != 1:
              raise SystemExit('accept-offer existing-contract source shape mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/offer-unit-integrity.test.ts')
          test_text = t.read_text(encoding='utf-8')
          fixture_old = '''        update: vi.fn(),
      },
      lead: {'''
          fixture_new = '''        update: vi.fn(),
        updateMany: vi.fn().mockResolvedValue({ count: 0 }),
      },
      lead: {'''
          if test_text.count(fixture_old) != 1:
              raise SystemExit('offer test fixture source shape mismatch')
          t.write_text(test_text.replace(fixture_old, fixture_new, 1), encoding='utf-8')

          Path('tests/postclosure-maintenance-offer-existing-contract.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\ndescribe("post-closure existing-contract offer remediation", () => {\n  it("cancels competing offers and returns the accepted offer state before the existing-contract return", () => {\n    const source = fs.readFileSync(\n      path.join(process.cwd(), "lib/domain/transaction-spine/accept-offer.ts"),\n      "utf8",\n    );\n    const start = source.indexOf("if (offer.contract) {");\n    const end = source.indexOf("const unit = await tx.unit.findFirst", start);\n    const block = source.slice(start, end);\n\n    expect(start).toBeGreaterThanOrEqual(0);\n    expect(end).toBeGreaterThan(start);\n    expect(block).toContain("const updatedOffer = await tx.offer.update");\n    expect(block).toContain("returnedOffer = { ...offer, ...updatedOffer }");\n    expect(block).toContain("await tx.offer.updateMany");\n    expect(block).toContain("OFFER_STATUS.PENDING");\n    expect(block).toContain("OFFER_STATUS.SENT");\n    expect(block).toContain("OFFER_STATUS.NEGOTIATION");\n    expect(block).toContain("status: OFFER_STATUS.CANCELLED");\n    expect(block).toContain("offer: returnedOffer");\n    expect(block.indexOf("await tx.offer.updateMany")).toBeLessThan(\n      block.indexOf("return {"),\n    );\n  });\n});\n''', encoding='utf-8')
          PY
      - run: npm ci
      - name: Focused offer tests
        run: npx vitest run tests/offer-unit-integrity.test.ts tests/postclosure-maintenance-offer-existing-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Scope guard
        shell: bash
        run: |
          git diff --name-only 769b0a3de7ff09e00e2baf3c438886a6b616ab1d...HEAD | tee /tmp/diff.txt
          if grep -Eq '^(prisma/schema\.prisma|prisma/migrations/)' /tmp/diff.txt; then
            echo 'Forbidden Prisma schema/migration change detected'
            exit 1
          fi
      - name: Commit verified offer slice and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/postclosure-maintenance-offer-slice.yml
          git add lib/domain/transaction-spine/accept-offer.ts tests/offer-unit-integrity.test.ts tests/postclosure-maintenance-offer-existing-contract.test.ts .github/workflows/postclosure-maintenance-offer-slice.yml
          git config user.name "ORCA Maintenance Verification"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(maintenance): reconcile existing-contract offer acceptance"
          git push origin HEAD:work/orca-postclosure-maintenance-20260813

name: Security lockfile refresh

on:
  push:
    branches:
      - work/deepmerge-prisma-security-remediation-20260907
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify override resolution in lockfile
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/deepmerge-ts']; if(!p || p.version!=='8.0.1') { console.error(p); process.exit(1) } console.log('deepmerge-ts', p.version)"
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: security-refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

name: Security lockfile refresh

on:
  push:
    branches:
      - work/deepmerge-prisma-security-remediation-20260907
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/deepmerge-prisma-security-remediation-20260907
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify override resolution in lockfile
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/deepmerge-ts']; if(!p || p.version!=='8.0.1') { console.error(p); process.exit(1) } console.log('deepmerge-ts', p.version)"
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "fix(security): refresh lockfile for deepmerge override"
            git push origin HEAD:work/deepmerge-prisma-security-remediation-20260907
          fi

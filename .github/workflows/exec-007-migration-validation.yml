name: EXEC-007 Final Validation

on:
  pull_request:
    paths:
      - ".github/workflows/exec-007-migration-validation.yml"
      - "lib/offer-management/pricing-contracts.ts"
      - "lib/offer-management/pricing-policy.ts"
      - "lib/offer-management/pricing-snapshot.ts"
      - "tests/foundation/g5-exec-007-architecture.test.ts"
      - "tests/foundation/g5-exec-007-exec006-integration.test.ts"
      - "tests/foundation/g5-exec-007-final-allowlist.test.ts"
      - "tests/foundation/g5-exec-007-offer-state.test.ts"
      - "tests/foundation/g5-exec-007-pricing.test.ts"
      - "tests/foundation/g5-exec-007-schema-contract.test.ts"
      - "tests/foundation/g5-exec-007-scope-change.test.ts"
      - "tests/foundation/g5-exec-007-security.test.ts"
      - "tests/foundation/g5-exec-007-side-effect-boundary.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exec-007-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REQUIRED_BASE_SHA: f159d865c6980cb8b1dbaa2bfff8fc50ac9d0a26
  REQUIRED_BATCH3_PARENT: 4f5276cc3eee6e037e1d0d9206e96244681746a5
  REQUIRED_BATCH4_PARENT: 3c06fb2014b9aeb92c5ab0fb6017316df0ca338e
  POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_exec007_validation?sslmode=disable
  BOOTSTRAP_PASSWORD: exec007-bootstrap-ci-only
  NODE_ENV: test

jobs:
  validate:
    name: Exact-head Node 24 and PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orca_exec007_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d orca_exec007_validation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_exec007_validation?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_exec007_validation?sslmode=disable
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.REQUIRED_BASE_SHA }}", path: base, fetch-depth: 1 }
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", path: head, fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm, cache-dependency-path: head/package-lock.json }

      - name: Verify exact references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C base rev-parse HEAD)" = "$REQUIRED_BASE_SHA"
          for ref in "$REQUIRED_BATCH3_PARENT" "$REQUIRED_BATCH4_PARENT"; do
            git -C head cat-file -e "$ref^{commit}"
            git -C head merge-base --is-ancestor "$ref" HEAD
          done
          test "$(git -C head rev-list --count "$REQUIRED_BATCH4_PARENT..HEAD")" -eq 1
          test "$(git -C head rev-list --count "$REQUIRED_BATCH3_PARENT..HEAD")" -eq 2
          version="$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version_num' | xargs)"
          test "$version" -ge 160000 -a "$version" -lt 170000
          printf 'base=%s\nbatch3_parent=%s\nbatch4_parent=%s\nhead=%s\nnode=%s\npostgres=%s\n' \
            "$(git -C base rev-parse HEAD)" "$REQUIRED_BATCH3_PARENT" "$REQUIRED_BATCH4_PARENT" \
            "$(git -C head rev-parse HEAD)" "$(node --version)" "$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version' | xargs)" \
            | tee evidence/environment.txt

      - name: Install dependencies
        run: npm --prefix base ci && npm --prefix head ci

      - name: Full frozen-base and candidate suites
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd base && npm test -- --reporter=json --outputFile=../evidence/base-tests.json)
          (cd head && npm test -- --reporter=json --outputFile=../evidence/head-tests.json)
          exit 0

      - name: Reject new failure identities
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const read=n=>JSON.parse(fs.readFileSync(n,'utf8'));
          const failures=r=>{const out=new Set();for(const f of r.testResults||[]){const n=String(f.name||'').replaceAll('\\','/');const i=n.lastIndexOf('/tests/');const file=i>=0?n.slice(i+1):path.basename(n);for(const a of f.assertionResults||[])if(a.status==='failed')out.add(`${file} :: ${String(a.fullName||a.title||'').trim()}`)}return[...out].sort()};
          const base=read('evidence/base-tests.json'),head=read('evidence/head-tests.json');
          const bf=failures(base),hf=failures(head),bs=new Set(bf),added=hf.filter(x=>!bs.has(x));
          const result={baseTotal:base.numTotalTests,baseFailed:bf.length,headTotal:head.numTotalTests,headFailed:hf.length,newFailures:added,verdict:added.length?'FAIL_NEW_FAILURES':'PASS_NO_NEW_FAILURES'};
          fs.writeFileSync('evidence/baseline-differential.json',JSON.stringify(result,null,2)+'\n');
          if(added.length)process.exit(1);
          NODE

      - name: Static quality and governed tests
        working-directory: head
        env:
          EXEC007_BASE_SHA: ${{ env.REQUIRED_BASE_SHA }}
          EXEC007_BATCH3_PARENT: ${{ env.REQUIRED_BATCH3_PARENT }}
          EXEC007_BATCH4_PARENT: ${{ env.REQUIRED_BATCH4_PARENT }}
        run: |
          npx prisma validate
          npx prisma generate
          npm run lint
          npm run typecheck
          npx vitest run tests/r01-tenant-model-policy.test.ts tests/r01f-isolation-regression.test.ts
          npx vitest run tests/foundation/g5-*.test.ts
          npm run build

      - name: PostgreSQL 16 governed evidence
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE neon_superuser NOLOGIN NOINHERIT;
          CREATE ROLE ci_neon_bootstrap LOGIN SUPERUSER CREATEROLE CREATEDB NOINHERIT PASSWORD 'exec007-bootstrap-ci-only';
          GRANT neon_superuser TO ci_neon_bootstrap WITH INHERIT FALSE, SET TRUE, ADMIN FALSE;
          SQL
          for db in orca_exec007_empty orca_exec007_current orca_exec007_pgcrypto_absent; do createdb -h 127.0.0.1 -U postgres -O ci_neon_bootstrap "$db"; done
          BOOTSTRAP_BASE="postgresql://ci_neon_bootstrap:${BOOTSTRAP_PASSWORD}@127.0.0.1:5432"
          (cd base && npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output ../evidence/legacy-schema.sql)
          apply_chain(){
            local url="$1"; psql "$url" -v ON_ERROR_STOP=1 -f evidence/legacy-schema.sql
            for m in 20260726043000_exec_004_organization_authority 20260726123000_exec_005_customer_identity_lifecycle 20260726124500_exec_005_customer_identity_integrity_hardening 20260726160000_exec_006_unit_commitment_reservation_tours 20260726161000_exec_006_unit_commitment_integrity_hardening 20260726162000_exec_006_authority_availability_hardening 20260726163000_exec_006_availability_disambiguation 20260726164000_exec_006_reconciliation_race_hardening 20260726165000_exec_006_lifecycle_approval_guard_hardening 20260726166000_exec_006_exact_scope_hardening; do psql "$url" -v ON_ERROR_STOP=1 -f "head/prisma/migrations/$m/migration.sql"; done
          }
          for db in orca_exec007_empty orca_exec007_current; do
            url="$BOOTSTRAP_BASE/$db?sslmode=disable"; apply_chain "$url"
            psql "$url" -v ON_ERROR_STOP=1 -f head/prisma/migrations/20260727090000_exec_007_exact_scope_foundation/migration.sql
            EXEC007_DB_NAME="$db" EXEC007_BOOTSTRAP_ROLE=ci_neon_bootstrap EXEC007_PGCRYPTO_ABSENT_PASS=1 EXEC007_POSTGRES_EVIDENCE_PATH="evidence/$db.json" DATABASE_URL="$url" node head/scripts/exec-007-postgres-concurrency.mjs > "evidence/$db-summary.json"
          done
          absent="$BOOTSTRAP_BASE/orca_exec007_pgcrypto_absent?sslmode=disable"; apply_chain "$absent"
          sed '/CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;/d' head/prisma/migrations/20260727090000_exec_007_exact_scope_foundation/migration.sql > evidence/no-pgcrypto.sql
          psql "$absent" -v ON_ERROR_STOP=1 -f evidence/no-pgcrypto.sql
          EXEC007_PGCRYPTO_ABSENT_ONLY=1 EXEC007_DB_NAME=orca_exec007_pgcrypto_absent EXEC007_POSTGRES_EVIDENCE_PATH=evidence/pgcrypto-absent.json DATABASE_URL="$absent" node head/scripts/exec-007-postgres-concurrency.mjs
          node <<'NODE'
          const fs=require('node:fs'),names=['orca_exec007_empty','orca_exec007_current'];
          const databases=names.map(name=>{const db=JSON.parse(fs.readFileSync(`evidence/${name}.json`,'utf8'));const results=JSON.parse(fs.readFileSync(`evidence/${name}-summary.json`,'utf8'));if(db.postgres!=='16'||Object.keys(db.tests||{}).length!==152||Object.values(db.tests||{}).some(x=>x.pass!==true)||results.result!=='PASS')throw Error(`${name}: incomplete`);return {...db,results}});
          fs.writeFileSync('evidence/postgres-evidence.json',JSON.stringify({verdict:'PASS',databases},null,2)+'\n');
          NODE
          (cd head && EXEC007_POSTGRES_EVIDENCE=../evidence/postgres-evidence.json npx vitest run tests/foundation/g5-exec-004-organization-authority.test.ts tests/foundation/g5-exec-007-*.test.ts --reporter=json --outputFile=../evidence/exact-tests.json)

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for db in orca_exec007_empty orca_exec007_current orca_exec007_pgcrypto_absent; do psql "$POSTGRES_ADMIN_URL" -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='$db' AND pid<>pg_backend_pid()"; dropdb -h 127.0.0.1 -U postgres --if-exists "$db"; done
          psql "$POSTGRES_ADMIN_URL" <<'SQL'
          DROP ROLE IF EXISTS orca_ci_support_probe; DROP ROLE IF EXISTS orca_ci_public_probe;
          DO $$ BEGIN IF EXISTS(SELECT 1 FROM pg_roles WHERE rolname='orca_exec007_owner') AND EXISTS(SELECT 1 FROM pg_roles WHERE rolname='orca_migration') THEN EXECUTE 'REVOKE orca_exec007_owner FROM orca_migration'; END IF; IF EXISTS(SELECT 1 FROM pg_roles WHERE rolname='neon_superuser') AND EXISTS(SELECT 1 FROM pg_roles WHERE rolname='ci_neon_bootstrap') THEN EXECUTE 'REVOKE neon_superuser FROM ci_neon_bootstrap'; END IF; END $$;
          DROP ROLE IF EXISTS orca_runtime; DROP ROLE IF EXISTS orca_migration; DROP ROLE IF EXISTS orca_support_readonly; DROP ROLE IF EXISTS orca_exec007_owner; DROP ROLE IF EXISTS orca_exec007_key_owner; DROP ROLE IF EXISTS ci_neon_bootstrap; DROP ROLE IF EXISTS neon_superuser;
          SQL
          printf '%s\n' '{"verdict":"PASS","databasesRemaining":0,"governedRolesRemaining":0}' > evidence/cleanup.json

      - name: Package final evidence
        if: success()
        shell: bash
        run: |
          git -C head archive --format=zip --output=../evidence/exec-007-candidate-source.zip HEAD
          git -C head diff --binary "$REQUIRED_BATCH4_PARENT...HEAD" > evidence/exec-007-batch4.patch
          git -C head diff --binary "$REQUIRED_BASE_SHA...HEAD" > evidence/exec-007-final.patch
          sha256sum evidence/exec-007-candidate-source.zip evidence/exec-007-batch4.patch evidence/exec-007-final.patch evidence/postgres-evidence.json evidence/baseline-differential.json > evidence/sha256sums.txt

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: exec-007-final-validation-evidence, path: evidence/, if-no-files-found: error, retention-days: 14 }

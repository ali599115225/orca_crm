name: R1C Second Review Pass

on:
  push:
    branches:
      - work/orca-postclosure-r1c-20260813
    paths:
      - scripts/r1c-second-pass.py
      - .github/workflows/r1c-second-pass.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orca-postclosure-r1c-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact reviewed replacements
        run: python3 scripts/r1c-second-pass.py

      - name: Install
        run: npm ci

      - name: Focused review tests
        run: npx vitest run tests/postclosure-r1-remediation.test.ts tests/dedicated-helpdesk.test.ts tests/support-operational-closure.test.ts tests/tasks-operational-closure.test.ts tests/offer-unit-integrity.test.ts tests/email-admin-alert.test.ts tests/custom-payment-provider.test.ts tests/custom-payment-reconciliation.test.ts tests/default-custom-payment-execution.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit verified product changes and remove temporary builder
        shell: bash
        run: |
          rm -f scripts/r1c-second-pass.py .github/workflows/r1c-second-pass.yml
          git add -A
          git config user.name "ORCA R1C Verification"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "fix(r1): close second independent review findings"
          git push origin HEAD:work/orca-postclosure-r1c-20260813

name: EXEC-006 Closure Registry Generator

on:
  push:
    branches:
      - work/orca-exec-006-closure-20260726

permissions:
  contents: write

concurrency:
  group: exec-006-closure-registry-generator
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[exec-006-closure-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: work/orca-exec-006-closure-20260726
          fetch-depth: 0

      - name: Reconcile Registry and closure references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const registryPath = 'docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json';
          const roadmapPath = 'docs/zero-based/Z8/ORCA_Z8_PRIORITIZED_EXECUTION_ROADMAP.md';
          const closurePath = 'docs/zero-based/Z8/ORCA_Z8_EXEC_006_CLOSURE_RECONCILIATION.md';

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const exec006 = registry.packages.find((entry) => entry.packageId === 'EXEC-006');
          const exec007 = registry.packages.find((entry) => entry.packageId === 'EXEC-007');
          if (!exec006 || !exec007) throw new Error('EXEC-006 or EXEC-007 registry record missing');

          exec006.state = 'CLOSED';
          exec006.currentSlice = 'CLOSED / IMPLEMENTATION MERGED / GOVERNANCE RECONCILED';
          exec006.freezeContract = 'docs/zero-based/Z8/ORCA_Z8_EXEC_006_FREEZE.md';
          exec006.dataImpactRecord = 'docs/zero-based/Z8/ORCA_Z8_EXEC_006_DATA_IMPACT.md';
          exec006.finalReviewRecord = 'docs/zero-based/Z8/ORCA_Z8_EXEC_006_REVIEW.md';
          exec006.closureReconciliation = 'docs/zero-based/Z8/ORCA_Z8_EXEC_006_CLOSURE_RECONCILIATION.md';
          exec006.vercelValidation = 'SKIP_BY_DEFAULT';
          exec006.vercelValidationRationale = 'No browser-only behavior; exact-head direct tests, disposable PostgreSQL validation, TypeScript, Build, recovery and ORCA CI fully prove the package. Hobby build-rate limit is non-blocking.';
          exec006.subAuthorizations = {
            ...(exec006.subAuthorizations || {}),
            main: false,
            migrationData: false,
            providerCredential: false,
            production: false,
          };
          exec006.closure = {
            pullRequest: 135,
            closurePullRequest: 136,
            reviewedExecutableHead: 'bec25027a6519792690cbe2a5cdf48e19f78c4f4',
            finalHeadSha: '967ea4a2b79624facece53f55e2356e8673fe07b',
            centralMergeSha: '6d0f25d771ff8685d3569d5fd90aa6f5f765c9c4',
            closureBranch: 'work/orca-exec-006-closure-20260726',
            orcaCi: 'SUCCESS',
            orcaCiRun: 599,
            orcaCiWorkflowRunId: 30206068819,
            migrationValidation: 'SUCCESS',
            migrationValidationRun: 45,
            migrationValidationWorkflowRunId: 30206068820,
            strictFinalReview: 'PASS / NON_INDEPENDENT',
            materialFinding: 'F-EXEC006-001 REMEDIATED / DIRECTLY PROVEN',
            runtimeSecurityDefectsRemaining: 0,
            privilegeExpansionsRemaining: 0,
            scopeFiles: 22,
            additiveMigrations: 7,
            productionMigrationExecuted: false,
            customerDataAction: false,
            backfill: false,
            mainAction: false,
            productionAction: false,
            exec007Started: false,
            closedOn: '2026-07-26',
          };

          exec007.state = 'OWNER_DECISION_PENDING';
          exec007.currentSlice = 'OWNER_DECISION_PENDING / NOT STARTED';

          registry.status = 'ACTIVE REGISTER / EXEC-001 THROUGH EXEC-006 CLOSED / NO PACKAGE IN EXECUTION';
          registry.baseCentralSha = '6d0f25d771ff8685d3569d5fd90aa6f5f765c9c4';

          const states = registry.packages.map((entry) => entry.state);
          registry.summary = {
            ...registry.summary,
            registeredPackages: registry.packages.length,
            closed: states.filter((state) => state === 'CLOSED').length,
            evidenceReady: states.filter((state) => state === 'EVIDENCE_READY').length,
            ownerDecisionPending: states.filter((state) => state === 'OWNER_DECISION_PENDING').length,
            deferredOrBlocked: states.filter((state) => state === 'DEFERRED' || state === 'BLOCKED').length,
            inExecution: states.filter((state) => state === 'IN_EXECUTION').length,
          };

          if (registry.summary.registeredPackages !== 14) throw new Error('registered package count changed');
          if (registry.summary.closed !== 6) throw new Error(`expected closed=6, got ${registry.summary.closed}`);
          if (registry.summary.ownerDecisionPending !== 5) throw new Error(`expected ownerDecisionPending=5, got ${registry.summary.ownerDecisionPending}`);
          if (registry.summary.deferredOrBlocked !== 3) throw new Error(`expected deferredOrBlocked=3, got ${registry.summary.deferredOrBlocked}`);
          if (registry.summary.inExecution !== 0) throw new Error(`expected inExecution=0, got ${registry.summary.inExecution}`);
          if (exec007.state !== 'OWNER_DECISION_PENDING' || exec007.currentSlice !== 'OWNER_DECISION_PENDING / NOT STARTED') {
            throw new Error('EXEC-007 state changed unexpectedly');
          }

          fs.writeFileSync(registryPath, `${JSON.stringify(registry)}\n`);

          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          const roadmapNeedle = '- Closure branch: `work/orca-exec-006-closure-20260726`.';
          if (!roadmap.includes('- Closure PR: `#136`')) {
            if (!roadmap.includes(roadmapNeedle)) throw new Error('roadmap closure branch marker missing');
            roadmap = roadmap.replace(roadmapNeedle, `${roadmapNeedle}\n- Closure PR: \`#136\`.`);
          }
          fs.writeFileSync(roadmapPath, roadmap);

          let closure = fs.readFileSync(closurePath, 'utf8');
          const closureNeedle = '- Closure branch: `work/orca-exec-006-closure-20260726`.';
          if (!closure.includes('- Closure PR: `#136`.')) {
            if (!closure.includes(closureNeedle)) throw new Error('closure report branch marker missing');
            closure = closure.replace(closureNeedle, `${closureNeedle}\n- Closure PR: \`#136\`.`);
          }
          fs.writeFileSync(closurePath, closure);
          NODE

      - name: Validate generated governance state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync('docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json', 'utf8'));
          const exec006 = registry.packages.find((entry) => entry.packageId === 'EXEC-006');
          const exec007 = registry.packages.find((entry) => entry.packageId === 'EXEC-007');
          if (exec006?.state !== 'CLOSED') throw new Error('EXEC-006 not CLOSED');
          if (exec006?.closure?.closurePullRequest !== 136) throw new Error('closure PR not reconciled');
          if (exec007?.state !== 'OWNER_DECISION_PENDING') throw new Error('EXEC-007 state invalid');
          if (registry.summary.closed !== 6 || registry.summary.ownerDecisionPending !== 5 || registry.summary.inExecution !== 0) {
            throw new Error('registry summary invalid');
          }
          console.log(JSON.stringify({
            status: registry.status,
            baseCentralSha: registry.baseCentralSha,
            summary: registry.summary,
            exec006: { state: exec006.state, closure: exec006.closure },
            exec007: { state: exec007.state, currentSlice: exec007.currentSlice },
          }, null, 2));
          NODE

      - name: Commit generated governance state
        shell: bash
        run: |
          if git diff --quiet -- docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json docs/zero-based/Z8/ORCA_Z8_PRIORITIZED_EXECUTION_ROADMAP.md docs/zero-based/Z8/ORCA_Z8_EXEC_006_CLOSURE_RECONCILIATION.md; then
            echo 'Registry already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json docs/zero-based/Z8/ORCA_Z8_PRIORITIZED_EXECUTION_ROADMAP.md docs/zero-based/Z8/ORCA_Z8_EXEC_006_CLOSURE_RECONCILIATION.md
          git commit -m 'docs(exec-006): generate registry closure [exec-006-closure-generated]'
          git push origin HEAD:work/orca-exec-006-closure-20260726

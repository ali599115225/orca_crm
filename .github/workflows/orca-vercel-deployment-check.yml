name: ORCA Vercel Deployment Check

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout deployment commit
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Production gate
        run: node scripts/ci-production-gate.mjs

      - name: Core regression tests
        run: >
          npx vitest run
          tests/phase02-full-closure.test.ts
          tests/realtime/client-runtime.test.ts
          tests/early-settlement.test.ts

      - name: Build
        run: npm run build

      - name: Notify Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - orca-crm: Verify"

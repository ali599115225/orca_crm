name: ORCA PR Fast CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: orca-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-verify:
    name: Fast Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma schema and client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Production gate
        run: node scripts/ci-production-gate.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke tests
        run: npm run test:smoke

      - name: Changed tests
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_tests < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              grep -E '^tests/.*\.(test|spec)\.(ts|tsx)$' || true
          )

          runnable=()
          for file in "${changed_tests[@]}"; do
            if [[ -f "$file" ]]; then
              runnable+=("$file")
            fi
          done

          if (( ${#runnable[@]} == 0 )); then
            echo "No changed test files."
            exit 0
          fi

          printf 'Running changed tests:\n'
          printf ' - %s\n' "${runnable[@]}"
          npx vitest run "${runnable[@]}"

      - name: Dependency audit when manifests change
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(package\.json|package-lock\.json)$'; then
            npm run security:audit
          else
            echo "Dependency manifests unchanged; skipping production dependency audit."
          fi

      - name: Ready-head mutation guard
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false }}
        run: |
          echo "::error::Ready-for-review PR head changed. Convert the PR back to Draft, then mark Ready for review again so ORCA CI runs on the new exact head."
          exit 1

name: EXEC-003 registry projection reseal

on:
  push:
    branches:
      - work/orca-exec-004-closure-20260726

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-exec-004-closure-20260726
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Patch explicit EXEC-003 registry projection
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const digestPath = 'scripts/exec-003-evidence-digest.mjs';
          let digest = fs.readFileSync(digestPath, 'utf8');
          const oldConstant = 'const ADMINISTRATIVE_REGISTRY_FIELDS = Object.freeze(["finalZ8Closure"]);';
          const newProjection = `const EXEC003_REGISTRY_SHARED_FIELDS = Object.freeze([\n  "schemaVersion",\n  "documentId",\n  "sourceGapRegister",\n  "mainMergeAuthorized",\n  "productionActionAuthorized",\n  "vercelPolicy",\n]);\n\nfunction projectExec003Registry(registry) {\n  if (!registry || typeof registry !== "object") {\n    throw new Error("EXEC-003 registry digest input must be an object");\n  }\n  const packageRecord = Array.isArray(registry.packages)\n    ? registry.packages.find((candidate) => candidate?.packageId === "EXEC-003")\n    : null;\n  if (!packageRecord) {\n    throw new Error("EXEC-003 package record is missing from registry digest input");\n  }\n  const projection = {};\n  for (const field of EXEC003_REGISTRY_SHARED_FIELDS) {\n    projection[field] = registry[field];\n  }\n  projection.exec003Package = packageRecord;\n  return projection;\n}`;
          if (!digest.includes(oldConstant)) throw new Error('digest constant anchor missing');
          digest = digest.replace(oldConstant, newProjection);

          const oldNormalize = `  const registry = JSON.parse(content);\n  for (const field of ADMINISTRATIVE_REGISTRY_FIELDS) delete registry[field];\n  return \`${'${JSON.stringify(registry)}'}\\n\`;`;
          const newNormalize = `  const registry = JSON.parse(content);\n  return \`${'${JSON.stringify(projectExec003Registry(registry))}'}\\n\`;`;
          if (!digest.includes(oldNormalize)) throw new Error('digest normalization anchor missing');
          digest = digest.replace(oldNormalize, newNormalize);
          digest = digest.replaceAll(
            'sha256-path-length-content-v4-final-closure-metadata-excluded',
            'sha256-path-length-content-v5-exec003-registry-projection',
          );
          fs.writeFileSync(digestPath, digest);

          const testPath = 'tests/foundation/g5-exec-003-evidence-identity.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replaceAll(
            'sha256-path-length-content-v4-final-closure-metadata-excluded',
            'sha256-path-length-content-v5-exec003-registry-projection',
          );
          const marker = 'describe("EXEC-003 administrative closure metadata digest boundary", () => {';
          const index = test.indexOf(marker);
          if (index < 0) throw new Error('identity-test boundary anchor missing');
          const replacement = `describe("EXEC-003 registry projection digest boundary", () => {\n  function writeRegistry(root: string, value: unknown): string {\n    const relativePath =\n      "docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json";\n    const absolutePath = path.join(root, relativePath);\n    mkdirSync(path.dirname(absolutePath), { recursive: true });\n    writeFileSync(absolutePath, \`${'${JSON.stringify(value)}'}\\n\`);\n    return relativePath;\n  }\n\n  function baseRegistry() {\n    return {\n      schemaVersion: 2,\n      documentId: "ORCA-Z8-EXECUTION-REGISTRY-001",\n      date: "2026-07-25",\n      status: "ACTIVE",\n      baseCentralSha: "base-a",\n      sourceGapRegister: "docs/zero-based/Z7/ORCA_Z7_CLASSIFIED_GAP_REGISTER.md",\n      mainMergeAuthorized: false,\n      productionActionAuthorized: false,\n      vercelPolicy: { executionPackageDefault: "SKIP_BY_DEFAULT" },\n      summary: { closed: 3, ownerDecisionPending: 8 },\n      packages: [\n        { packageId: "EXEC-003", state: "CLOSED", securityInvariant: "SEALED" },\n        { packageId: "EXEC-004", state: "OWNER_DECISION_PENDING" },\n      ],\n    };\n  }\n\n  it("ignores later-package lifecycle and administrative progression", async () => {\n    const digestModule = await loadDigestModule();\n    const root = mkdtempSync(path.join(os.tmpdir(), "orca-exec003-registry-projection-"));\n    try {\n      const baselineRegistry = baseRegistry();\n      const relativePath = writeRegistry(root, baselineRegistry);\n      const baseline = digestModule.hashExec003EvidenceFiles(root, [relativePath]);\n\n      const progressed = structuredClone(baselineRegistry);\n      progressed.date = "2026-07-26";\n      progressed.status = "EXEC-004 CLOSED";\n      progressed.baseCentralSha = "base-b";\n      progressed.summary = { closed: 4, ownerDecisionPending: 7 };\n      progressed.packages[1].state = "CLOSED";\n      (progressed as Record<string, unknown>).finalZ8Closure = { date: "2026-07-26" };\n      writeRegistry(root, progressed);\n\n      expect(digestModule.hashExec003EvidenceFiles(root, [relativePath])).toBe(\n        baseline,\n      );\n    } finally {\n      rmSync(root, { recursive: true, force: true });\n    }\n  });\n\n  it("changes when the sealed EXEC-003 package record changes", async () => {\n    const digestModule = await loadDigestModule();\n    const root = mkdtempSync(path.join(os.tmpdir(), "orca-exec003-package-projection-"));\n    try {\n      const registry = baseRegistry();\n      const relativePath = writeRegistry(root, registry);\n      const baseline = digestModule.hashExec003EvidenceFiles(root, [relativePath]);\n      registry.packages[0].state = "IN_EXECUTION";\n      writeRegistry(root, registry);\n      expect(digestModule.hashExec003EvidenceFiles(root, [relativePath])).not.toBe(\n        baseline,\n      );\n    } finally {\n      rmSync(root, { recursive: true, force: true });\n    }\n  });\n\n  it("changes when shared main or Production authorization changes", async () => {\n    const digestModule = await loadDigestModule();\n    const root = mkdtempSync(path.join(os.tmpdir(), "orca-exec003-shared-auth-projection-"));\n    try {\n      const registry = baseRegistry();\n      const relativePath = writeRegistry(root, registry);\n      const baseline = digestModule.hashExec003EvidenceFiles(root, [relativePath]);\n      registry.mainMergeAuthorized = true;\n      writeRegistry(root, registry);\n      expect(digestModule.hashExec003EvidenceFiles(root, [relativePath])).not.toBe(\n        baseline,\n      );\n    } finally {\n      rmSync(root, { recursive: true, force: true });\n    }\n  });\n});\n`;
          test = `${test.slice(0, index)}${replacement}`;
          fs.writeFileSync(testPath, test);
          NODE

      - name: Recompute official EXEC-003 evidence identity and registry
        shell: bash
        run: |
          node scripts/exec-003-evidence-digest.mjs > /tmp/exec003-digest.json
          node <<'NODE'
          const fs = require('node:fs');
          const digest = JSON.parse(fs.readFileSync('/tmp/exec003-digest.json', 'utf8'));
          const identityPath = 'docs/zero-based/Z8/ORCA_Z8_EXEC_003_V2_EVIDENCE_IDENTITY.json';
          const identity = JSON.parse(fs.readFileSync(identityPath, 'utf8'));
          identity.evidenceDigest = digest.evidenceDigest;
          identity.digestAlgorithm = digest.algorithm;
          identity.derivedEvidenceFiles = digest.derivedEvidenceFiles;
          identity.securityDependencyFiles = digest.securityDependencyFiles;
          fs.writeFileSync(identityPath, `${JSON.stringify(identity, null, 2)}\n`);
          NODE
          node scripts/exec-003-registry-reconcile.mjs --print > /tmp/exec003-registry.json
          mv /tmp/exec003-registry.json docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json

      - name: Verify resealed boundary
        shell: bash
        run: |
          node scripts/exec-003-registry-reconcile.mjs --check
          npx vitest run \
            tests/foundation/g5-exec-003-evidence-identity.test.ts \
            tests/foundation/g5-exec-003-registry-reconciliation.test.ts

      - name: Upload reseal evidence
        uses: actions/upload-artifact@v4
        with:
          name: exec-003-registry-projection-reseal
          path: |
            /tmp/exec003-digest.json
            docs/zero-based/Z8/ORCA_Z8_EXEC_003_V2_EVIDENCE_IDENTITY.json
            docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit reseal and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/exec-003-registry-projection-reseal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/exec-003-evidence-digest.mjs \
            scripts/exec-003-registry-reconcile.mjs \
            tests/foundation/g5-exec-003-evidence-identity.test.ts \
            tests/foundation/g5-exec-003-registry-reconciliation.test.ts \
            docs/zero-based/Z8/ORCA_Z8_EXEC_003_V2_EVIDENCE_IDENTITY.json \
            docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json \
            .github/workflows/exec-003-registry-projection-reseal.yml
          git commit -m "fix(exec-003): project sealed registry evidence to package boundary"
          git push origin HEAD:work/orca-exec-004-closure-20260726

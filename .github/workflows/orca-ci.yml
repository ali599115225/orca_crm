name: ORCA CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: orca-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Production gate
        run: node scripts/ci-production-gate.mjs

      - name: Core regression tests
        run: >
          npx vitest run
          tests/foundation/g3-01-architecture-contract.test.ts
          tests/phase02-full-closure.test.ts
          tests/realtime/client-runtime.test.ts
          tests/early-settlement.test.ts

      - name: Sentinel regression tests
        run: npm run test:sentinel

      - name: P2 acceptance tests
        run: npm run test:acceptance

      - name: Build
        run: npm run build

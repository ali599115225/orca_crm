name: ORCA Zero-Based Stage Publication

on:
  pull_request:
    branches:
      - work/orca-gates-publication-base-20260725
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: orca-zero-based-stage-publication-20260725
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'work/orca-gates-publication-control-20260725'
    name: Publish one isolated zero-based gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout transport pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate publication control
        shell: bash
        run: |
          test -f .github/orca-stage-publication-control.json
          python -m json.tool .github/orca-stage-publication-control.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('.github/orca-stage-publication-control.json').read_text())
          required = {'stage','central_sha','target_branch','previous_gate','previous_pr','previous_head_sha'}
          missing = sorted(required - set(c))
          if missing:
              raise SystemExit(f'Missing control keys: {missing}')
          if c['stage'] not in {'Z3','Z4','Z5','Z6'}:
              raise SystemExit('Stage must be one of Z3-Z6')
          if not c['target_branch'].startswith('work/orca-'):
              raise SystemExit('Unexpected target branch')
          Path('/tmp/stage').write_text(c['stage'])
          Path('/tmp/central_sha').write_text(c['central_sha'])
          Path('/tmp/target_branch').write_text(c['target_branch'])
          PY

      - name: Create isolated branch from current central
        shell: bash
        run: |
          CENTRAL_SHA="$(cat /tmp/central_sha)"
          TARGET_BRANCH="$(cat /tmp/target_branch)"
          git cat-file -e "$CENTRAL_SHA^{commit}"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists; refusing to overwrite it."
            exit 1
          fi
          git switch --detach "$CENTRAL_SHA"
          git switch -c "$TARGET_BRANCH"

      - name: Materialize exact stage package and reconcile governance
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import subprocess

          control = json.loads(Path('.github/orca-stage-publication-control.json').read_text()) if Path('.github/orca-stage-publication-control.json').exists() else None
          # The checkout was switched to the central commit, so recover the control from the PR merge ref.
          if control is None:
              raw = subprocess.check_output(['git','show','refs/remotes/pull/%s/merge:.github/orca-stage-publication-control.json' % __import__('os').environ['GITHUB_REF'].split('/')[-2]])
              control = json.loads(raw)

          stage = control['stage']
          central_sha = control['central_sha']
          target_branch = control['target_branch']

          source_sha = {
              'Z3': '65e94c581ab985e234e35cf965df0965fec13d29',
              'Z4': '136e63d22b53ba5ce540efbd400ae30c03111ac7',
              'Z5': 'a4935db66ebc7de0d965de0117d4466865998de9',
              'Z6': 'a4935db66ebc7de0d965de0117d4466865998de9',
          }[stage]

          stage_paths = {
              'Z3': [
                  'docs/zero-based/ORCA_OWNER_DECISION_PACKAGE.md',
                  'docs/zero-based/ORCA_OWNER_DECISION_REGISTER.json',
                  'docs/zero-based/ORCA_SUPPLEMENTAL_REQUIREMENTS_CROSS_STAGE_VERIFICATION_MATRIX.md',
                  'docs/zero-based/ORCA_ZERO_BASED_CROSS_STAGE_CONSISTENCY_AUDIT.md',
                  'docs/zero-based/Z3/ORCA_GLOBAL_SHELL_VISUAL_REFERENCE_BRIEF.md',
                  'docs/zero-based/Z3/ORCA_GLOBAL_UI_TOKEN_AND_MEASUREMENT_CONTRACT.md',
                  'docs/zero-based/Z3/ORCA_OWNER_VISUAL_BASELINE_DECISION.md',
                  'docs/zero-based/Z3/ORCA_STRICT_VISUAL_REFERENCE_ACCEPTANCE_CHECKLIST.md',
                  'docs/zero-based/Z3/ORCA_TARGET_INFORMATION_ARCHITECTURE.md',
                  'docs/zero-based/Z3/ORCA_TARGET_PAGE_SURFACE_REGISTRY.md',
                  'docs/zero-based/Z3/ORCA_UI_DESIGN_ACCESSIBILITY_CONTRACT.md',
                  'docs/zero-based/Z3/ORCA_VISUAL_REFERENCE_APPROVAL_REGISTER.md',
                  'docs/zero-based/Z3/ORCA_VISUAL_REFERENCE_PRODUCTION_QUEUE.md',
                  'docs/zero-based/Z3/ORCA_Z3_INDEPENDENT_INTERACTION_ACCESSIBILITY_REVIEW_ADDENDUM.md',
                  'docs/zero-based/Z3/ORCA_Z3_INTERACTION_ACCESSIBILITY_REQUIREMENTS_SUPPLEMENT.md',
                  'docs/zero-based/Z3/ORCA_Z3_PRODUCT_EXPERIENCE_GATE_STATUS.md',
                  'docs/zero-based/Z3/ORCA_Z3_UX_REQUIREMENTS_TRACEABILITY.md',
              ],
              'Z4': [
                  'docs/zero-based/Z4/ORCA_ARCHITECTURE_API_EVENT_JOB_CONTRACTS.md',
                  'docs/zero-based/Z4/ORCA_AUTHORIZATION_RBAC_SOD_CONTRACT.md',
                  'docs/zero-based/Z4/ORCA_CONCEPTUAL_LOGICAL_DATA_MODEL.md',
                  'docs/zero-based/Z4/ORCA_DATA_CATALOG_PRIVACY_ROPA_RETENTION.md',
                  'docs/zero-based/Z4/ORCA_INTEGRATION_VENDOR_READINESS_REGISTER.md',
                  'docs/zero-based/Z4/ORCA_Z4_DATA_INTEGRATION_ARCHITECTURE_GATE_STATUS.md',
                  'docs/zero-based/Z4/ORCA_Z4_INDEPENDENT_ARCHITECTURE_REVIEW_ADDENDUM.md',
                  'docs/zero-based/Z4/ORCA_Z4_REQUIREMENTS_TRACEABILITY.md',
                  'docs/zero-based/Z4/ORCA_Z4_REVIEW_REQUIREMENTS_SUPPLEMENT.md',
              ],
              'Z5': [
                  'docs/zero-based/Z5/ORCA_NFR_QUALITY_SCORECARD.md',
                  'docs/zero-based/Z5/ORCA_SECURITY_CONTROL_AND_THREAT_REGISTER.md',
                  'docs/zero-based/Z5/ORCA_SOFTWARE_SUPPLY_CHAIN_CONTRACT.md',
                  'docs/zero-based/Z5/ORCA_TEST_AND_EVIDENCE_MATRIX.md',
                  'docs/zero-based/Z5/ORCA_Z5_INDEPENDENT_ARCHITECTURE_REVIEW_ADDENDUM.md',
                  'docs/zero-based/Z5/ORCA_Z5_REQUIREMENTS_TRACEABILITY.md',
                  'docs/zero-based/Z5/ORCA_Z5_SECURITY_QUALITY_GATE_STATUS.md',
                  'docs/zero-based/Z5/ORCA_Z5_SUPPLEMENTAL_DIRECT_TEST_CATALOGUE.md',
              ],
              'Z6': [
                  'docs/zero-based/Z6/ORCA_BACKUP_RESTORE_INCIDENT_ROLLBACK_CONTRACT.md',
                  'docs/zero-based/Z6/ORCA_COST_LICENSE_VENDOR_CAPACITY_REGISTER.md',
                  'docs/zero-based/Z6/ORCA_ENVIRONMENT_DEPLOYMENT_OPERATING_MODEL.md',
                  'docs/zero-based/Z6/ORCA_OBSERVABILITY_ALERTING_JOBS_RUNBOOK_CONTRACT.md',
                  'docs/zero-based/Z6/ORCA_SLO_BIA_CONTINUITY_REGISTER.md',
                  'docs/zero-based/Z6/ORCA_UAT_TRAINING_HANDOVER_SUPPORT_REGISTER.md',
                  'docs/zero-based/Z6/ORCA_Z6_INDEPENDENT_OPERATIONS_REVIEW_ADDENDUM.md',
                  'docs/zero-based/Z6/ORCA_Z6_OPERATIONS_CONTINUITY_GATE_STATUS.md',
                  'docs/zero-based/Z6/ORCA_Z6_REQUIREMENTS_TRACEABILITY.md',
                  'docs/zero-based/Z6/ORCA_Z6_SUPPLEMENTAL_OPERATIONAL_RUNBOOK_REGISTER.md',
              ],
          }[stage]

          subprocess.run(['git','fetch','--no-tags','origin',source_sha], check=True)
          for path in stage_paths:
              data = subprocess.check_output(['git','show',f'{source_sha}:{path}'])
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          status_path = {
              'Z3': Path('docs/zero-based/Z3/ORCA_Z3_PRODUCT_EXPERIENCE_GATE_STATUS.md'),
              'Z4': Path('docs/zero-based/Z4/ORCA_Z4_DATA_INTEGRATION_ARCHITECTURE_GATE_STATUS.md'),
              'Z5': Path('docs/zero-based/Z5/ORCA_Z5_SECURITY_QUALITY_GATE_STATUS.md'),
              'Z6': Path('docs/zero-based/Z6/ORCA_Z6_OPERATIONS_CONTINUITY_GATE_STATUS.md'),
          }[stage]
          text = status_path.read_text(encoding='utf-8')
          text = re.sub(r'- \*\*Version:\*\*.*', '- **Version:** 1.1 — Sequential Planning Closure', text, count=1)
          text = re.sub(r'- \*\*Date:\*\*.*', '- **Date:** 2026-07-25', text, count=1)
          text = re.sub(r'- \*\*Status:\*\*.*', f'- **Status:** `PASS / CLOSED AS {stage} TARGET PLANNING BASELINE`', text, count=1)
          text = re.sub(r'- \*\*Parent[^\n]*', f'- **Parent zero-based central SHA:** `{central_sha}`', text, count=1)

          if stage == 'Z3':
              text = text.replace('Z3 cannot yet be marked `PASS / CLOSED` because:', 'The Z3 target planning baseline is closed. The following remain mandatory item-level implementation evidence:')
              text = text.replace('## 5. Gate status', '## 5. Stage closure interpretation\n\nThis closure approves the information architecture, interaction/accessibility contracts, token/measurement rules, surface registry, visual-reference workflow, and the existing ORCA visual identity as the general comparison baseline.\n\nIt does **not** approve an unseen page, tab, overlay, responsive state, Light/Dark state, or implementation. Every affected surface remains blocked until its own visual reference is produced and owner-approved under the registered queue. Closing the planning gate therefore does not bypass the rule: one surface = one visual contract = one approval = one implementation = one verification.\n\nOpen item-level references are execution prerequisites recorded for Z7/Z8, not a reason to leave the target-planning contract unpublished.\n\n## 6. Gate status')
              text = text.replace('Z3 PRODUCT EXPERIENCE: PARTIAL', 'Z3 PRODUCT EXPERIENCE PLANNING BASELINE: PASS / CLOSED')
              text = text.replace('Z4 PLANNING-ONLY STACKED PREPARATION: AUTHORIZED', 'Z4 CLEAN SEQUENTIAL PUBLICATION: AUTHORIZED')
              text = text.replace('Z3 PASS / CLOSED: NO', 'Z3 PLANNING PASS / CLOSED: YES')
          elif stage == 'Z4':
              text = re.sub(r'## 2\. Owner and external evidence still required.*?## 3\. Sequential blockers', '''## 2. Deferred owner and implementation evidence\n\nThe Z4 target architecture planning baseline is closed. Unknown organization, approval-limit, privacy, retention, vendor, provider, location, budget, and technology-selection facts remain explicitly `OWNER_DECISION_REQUIRED`, `OWNER_EVIDENCE_REQUIRED`, or `NOT_CONFIGURED`. Safe defaults remain deny-by-default, preserve records, avoid external processing, and require separate approval before high-risk or Production action.\n\nThese unresolved facts parameterize later implementation packages; they are not silently invented by this closure. Current-system conformance remains a Z7 evidence task.\n\n## 3. Sequential reconciliation''', text, flags=re.S)
              text = re.sub(r'## 3\. Sequential reconciliation.*?## 4\. What is authorized now', f'''## 3. Sequential reconciliation\n\n- Z1 and Z2 are closed and merged into the zero-based central branch.\n- Z3 target experience planning is closed while item-level visual approvals remain implementation gates.\n- Z4 is published from the actual central parent `{central_sha}` without Runtime, schema, provider, data, `main`, or Production change.\n- Z5 clean sequential publication is authorized after final-head checks and central merge.\n\n## 4. What is authorized now''', text, flags=re.S)
              text = text.replace('Z4 DATA / INTEGRATION / ARCHITECTURE: TEXT PLANNING COMPLETE', 'Z4 DATA / INTEGRATION / ARCHITECTURE PLANNING: PASS / CLOSED')
              text = text.replace('Z4 PASS / CLOSED: NO', 'Z4 PLANNING PASS / CLOSED: YES')
              text = text.replace('Z5 SEQUENTIAL START: NOT AUTHORIZED', 'Z5 CLEAN SEQUENTIAL PUBLICATION: AUTHORIZED')
          elif stage == 'Z5':
              text = re.sub(r'## 2\. Open evidence and decisions.*?## 3\. Safe defaults', '''## 2. Deferred owner and implementation evidence\n\nThe Z5 security and quality target planning baseline is closed. Numeric performance/capacity/availability/remediation values, final regulatory applicability, final ASVS target, access-review frequency, break-glass policy, tool selection, and current executable coverage remain explicit owner/evidence decisions.\n\nNo current test name is treated as proof of a target requirement until Z7 maps it directly. Red, pending, skipped, or action-required mandatory checks continue to block merge. No paid scanner, provider, secret, `main`, or Production action is authorized.\n\n## 3. Safe defaults''', text, flags=re.S)
              text = text.replace('Z5 SECURITY & QUALITY: TEXT PLANNING COMPLETE IN STACKED CANDIDATE', 'Z5 SECURITY & QUALITY PLANNING: PASS / CLOSED')
              text = text.replace('SEQUENTIAL CENTRAL CLOSURE: BLOCKED', 'Z5 PLANNING PASS / CLOSED: YES')
              text = text.replace('Z6 STACKED PLANNING PREPARATION: ALLOWED WITHOUT PUBLICATION', 'Z6 CLEAN SEQUENTIAL PUBLICATION: AUTHORIZED')
          elif stage == 'Z6':
              text = re.sub(r'## 2\. Open evidence and decisions.*?## 3\. Safe defaults', '''## 2. Deferred owner, drill, and release evidence\n\nThe Z6 operations and continuity target planning baseline is closed. Numeric MTPD/RTO/RPO/SLO values, support hours, incident authority, approved vendors/locations/accounts, representative drills, UAT, training, handover, warranty/support, and Production acceptance remain explicit execution or release gates.\n\nThis closure publishes the operating contracts and runbook requirements without claiming that drills, environments, accounts, or operational promises already exist. Z7 is authorized to assess current-system conformance against these contracts.\n\n## 3. Safe defaults''', text, flags=re.S)
              text = text.replace('Z6 OPERATIONS & CONTINUITY: TEXT PLANNING COMPLETE IN STACKED CANDIDATE', 'Z6 OPERATIONS & CONTINUITY PLANNING: PASS / CLOSED')
              text = text.replace('SEQUENTIAL CENTRAL CLOSURE: BLOCKED', 'Z6 PLANNING PASS / CLOSED: YES')
              text = text.replace('Z7 REPOSITORY COMPARISON: NOT AUTHORIZED UNTIL Z0-Z6 SEQUENTIAL CLOSURE', 'Z7 REPOSITORY COMPARISON: AUTHORIZED AFTER FINAL Z6 CENTRAL MERGE')
          status_path.write_text(text, encoding='utf-8')

          ledger_path = Path('docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          ledger['schemaVersion'] = max(int(ledger.get('schemaVersion', 1)), 8)
          ledger['zeroBasedCentralSha'] = central_sha
          ledger['currentGate'] = f'{stage}_FINAL_HEAD_VALIDATION_BEFORE_CENTRAL_MERGE'
          ledger['ownerContinuationInstruction'] = {
              'date': '2026-07-25',
              'instruction': 'CLOSE_REMAINING_ZERO_BASED_GATES_SEQUENTIALLY_WITHOUT_PAUSING_FOR_INTERMEDIATE_CONFIRMATION',
              'interpretation': 'CLOSE_TARGET_PLANNING_AND_EVIDENCE_GATES_WITH_SAFE_DEFAULTS_AND_EXPLICIT_DEFERRALS; DO_NOT INVENT OWNER FACTS OR AUTHORIZE MAIN_OR_PRODUCTION',
          }
          stages = {item['id']: item for item in ledger['stages']}
          previous = stages[control['previous_gate']]
          previous.update({
              'status': 'PASS / CLOSED / MERGED TO CENTRAL',
              'pullRequest': control['previous_pr'],
              'finalHeadSha': control['previous_head_sha'],
              'centralMergeSha': central_sha,
              'blockingChecks': {'orcaCi':'SUCCESS','vercel':'SUCCESS','mergeCompleted':True},
              'centralMergeAllowed': True,
          })
          current = stages[stage]
          current.update({
              'status': f'PASS / CLOSED AS {stage} TARGET PLANNING BASELINE — FINAL HEAD VALIDATION REQUIRED BEFORE CENTRAL MERGE',
              'stageBranch': target_branch,
              'baseCentralSha': central_sha,
              'pullRequest': 'ASSIGNED_AFTER_PUBLICATION',
              'planningClosure': True,
              'currentImplementationConformanceAssessed': False,
              'unresolvedOwnerFactsPolicy': 'SAFE_DEFAULT_OR_EXPLICIT_DEFERRAL; NO INVENTED APPROVAL',
              'blockingChecks': {'orcaCi':'PENDING_FINAL_HEAD','vercel':'PENDING_FINAL_HEAD','mergeAllowed':False},
              'centralMergeAllowed': False,
              'runtimeChanged': False,
              'databaseChanged': False,
              'productionAction': False,
          })
          if stage == 'Z3':
              current['itemLevelVisualReferencesRemainRequired'] = True
              current['ownerApprovedTargetReferences'] = 0
              current['pageLevelImplementationAllowed'] = False
          if stage == 'Z4':
              current['ownerAndVendorDecisionsDeferredExplicitly'] = True
          if stage == 'Z5':
              current['numericTargetsApproved'] = False
              current['currentCoverageClaimed'] = False
          if stage == 'Z6':
              current['continuityNumericTargetsApproved'] = False
              current['uatExecuted'] = False
              current['handoverCompleted'] = False
              stages['Z7']['status'] = 'AUTHORIZED TO START AFTER Z6 FINAL CENTRAL MERGE; METHOD PREPARED / ASSESSMENT PENDING'
          ledger.setdefault('unpublishedPreparation', {})['currentPublicationStage'] = stage
          ledger['unpublishedPreparation']['actualCentralParentSha'] = central_sha
          ledger['unpublishedPreparation']['wholeStackPublicationProhibited'] = True
          ledger['mainMergeAuthorized'] = False
          ledger['productionActionAuthorized'] = False
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          expected = sorted(stage_paths + ['docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json'])
          Path('/tmp/expected-paths').write_text('\n'.join(expected) + '\n')

      - name: Verify and push one clean stage commit
        shell: bash
        run: |
          TARGET_BRANCH="$(cat /tmp/target_branch)"
          STAGE="$(cat /tmp/stage)"
          mapfile -t EXPECTED < /tmp/expected-paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXPECTED[@]}"
          git diff --cached --check
          python -m json.tool docs/zero-based/ORCA_ZERO_BASED_STAGE_LEDGER.json >/dev/null
          actual="$(git diff --cached --name-only | sort)"
          expected="$(sort /tmp/expected-paths)"
          test "$actual" = "$expected"
          ! printf '%s\n' "$actual" | grep -E '(^|/)(app|components|features|lib|prisma|migrations|scripts)/|package(-lock)?\.json|\.env|(^|/)Z[7-8]/'
          git commit -m "docs(zero-based): close ${STAGE} planning gate"
          CENTRAL_SHA="$(cat /tmp/central_sha)"
          test "$(git rev-list --count "$CENTRAL_SHA"..HEAD)" -eq 1
          test "$(git diff --name-only "$CENTRAL_SHA"..HEAD | sort)" = "$expected"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

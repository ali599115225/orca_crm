        }),
      },''',
              '''        body: JSON.stringify({
          userName: process.env.MSEGAT_USERNAME,
          apiKey: SMS_API_KEY,
          userSender:
            process.env.MSEGAT_SENDER_NAME || "ORCA-CRM",
          numbers: to.replace("+", ""),
          msg: message,
        }),
        signal: AbortSignal.timeout(15_000),
      },''',
          )

          # Update focused existing tests.
          path = 'tests/payment-providers.test.ts'
          replace_once(path, '      amount: 299_00,\n      currency: \'SAR\',\n      description: \'ORCA pro plan\',', '      amount: 299,\n      currency: \'SAR\',\n      description: \'ORCA pro plan\',')
          replace_once(path, "json: async () => ({ transactionNo: 'paylink-ref-1', orderStatus: 'PAID', amount: 299_00 }),", "json: async () => ({ transactionNo: 'paylink-ref-1', orderStatus: 'PAID', amount: 299 }),")

          path = 'tests/email-admin-alert.test.ts'
          replace_once(
              path,
              '''  it("calls sendEmail when SUPER_ADMIN_EMAILS and a CONNECTED provider exist", async () => {
    vi.stubEnv("SUPER_ADMIN_EMAILS", "owner@example.com");
    prismaMocks.findFirst.mockResolvedValue({ tenantId: "tenant-1" });
    prismaMocks.findMany.mockResolvedValue([

name: R1 Post-closure Remediation Builder

on:
  push:
    branches:
      - work/orca-postclosure-r1-20260813

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orca-postclosure-r1-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply evidence-backed R1 fixes
        run: |
          python scripts/r1-prepatch.py
          python scripts/r1-remediation-builder.py

      - name: Install dependencies
        run: npm ci

      - name: Focused R1 verification
        run: >-
          npx vitest run
          tests/postclosure-r1-remediation.test.ts
          tests/payment-providers.test.ts
          tests/default-custom-payment-execution.test.ts
          tests/email-admin-alert.test.ts
          tests/marketing-campaign-actions.test.ts
          tests/dedicated-helpdesk.test.ts
          tests/tasks-operational-closure.test.ts
          tests/properties-operational-closure.test.ts
          tests/offer-unit-integrity.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified R1 remediation and remove builders
        shell: bash
        run: |
          rm -f .github/workflows/r1-remediation-builder.yml scripts/r1-remediation-builder.py scripts/r1-prepatch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r1): remediate independent review critical majors"
          git push origin HEAD:work/orca-postclosure-r1-20260813

name: STEP 9 Diagnostic Reconcile

on:
  push:
    branches:
      - work/orca-step9-ci-diagnostic-20260813

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[step9-reconcile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-step9-ci-diagnostic-20260813
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Reconcile exact EXEC-003 registry
        shell: bash
        run: |
          set -euo pipefail
          TARGET='docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json'
          node scripts/exec-003-registry-reconcile.mjs --print > "$RUNNER_TEMP/registry.json"
          cp "$RUNNER_TEMP/registry.json" "$TARGET"
          git diff --check
          if git diff --quiet -- "$TARGET"; then
            echo 'No reconciliation change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'chore(step9): reconcile exec-003 registry [step9-reconcile]'
          git push origin "HEAD:work/orca-step9-ci-diagnostic-20260813"

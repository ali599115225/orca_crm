name: EXEC-004 closure reconciliation

on:
  push:
    branches:
      - work/orca-exec-004-closure-20260726

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-exec-004-closure-20260726
          fetch-depth: 0

      - name: Reconcile EXEC-004 registry closure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          const pkg = registry.packages.find((item) => item.packageId === 'EXEC-004');

          if (!pkg) throw new Error('EXEC-004 missing from registry');
          if (pkg.state !== 'OWNER_DECISION_PENDING') {
            throw new Error(`Unexpected EXEC-004 state: ${pkg.state}`);
          }
          if (registry.summary.closed !== 3 || registry.summary.ownerDecisionPending !== 8) {
            throw new Error(`Unexpected summary before closure: ${JSON.stringify(registry.summary)}`);
          }

          registry.date = '2026-07-26';
          registry.baseCentralSha = '8643f1858cd453c53bee60cc4184dfab2f7cebdb';
          registry.status = 'ACTIVE REGISTER / EXEC-001 THROUGH EXEC-004 CLOSED / NO PACKAGE IN EXECUTION';
          registry.summary.closed = 4;
          registry.summary.ownerDecisionPending = 7;
          registry.summary.evidenceReady = 0;
          registry.summary.inExecution = 0;

          Object.assign(pkg, {
            state: 'CLOSED',
            freezeContract: 'docs/zero-based/Z8/ORCA_Z8_EXEC_004_FREEZE.md',
            decisionRecord: 'docs/zero-based/Z8/ORCA_Z8_EXEC_004_DECISION_RECORD.md',
            dataImpact: 'docs/zero-based/Z8/ORCA_Z8_EXEC_004_DATA_IMPACT.md',
            currentSlice: 'CLOSED / INDEPENDENT FINAL REVIEW PASS / MERGED TO CENTRAL',
            securityInvariant: 'DENY BY DEFAULT; SAME TENANT AND EXACT ASSIGNMENT SCOPE REQUIRED',
            authorityModel: 'JOB_TITLE != SECURITY_ROLE != SCOPE_ASSIGNMENT',
            allowedPaths: [
              'app/actions/agentSlots.ts',
              'app/api/v1/agents/route.ts',
              'docs/zero-based/Z8/ORCA_Z8_EXEC_004_DATA_IMPACT.md',
              'docs/zero-based/Z8/ORCA_Z8_EXEC_004_DECISION_RECORD.md',
              'docs/zero-based/Z8/ORCA_Z8_EXEC_004_FREEZE.md',
              'lib/organization/authority.ts',
              'lib/organization/contracts.ts',
              'lib/organization/service.ts',
              'lib/organization/sql-repository.ts',
              'prisma/migrations/20260726043000_exec_004_organization_authority/migration.sql',
              'tests/dedicated-agent-slots.test.ts',
              'tests/foundation/g5-exec-004-organization-authority.test.ts',
              'tests/foundation/g5-exec-004-organization-service.test.ts',
              'tests/foundation/g5-exec-004-saas-retirement.test.ts',
              'tests/foundation/g5-exec-004-schema-contract.test.ts'
            ],
            preconditions: [
              'OWN-A01 CLOSED BY OWNER DECISION',
              'OWN-A02 CLOSED BY OWNER DECISION',
              'OWN-A03 CLOSED BY OWNER DECISION',
              'OWN-A04 CLOSED BY OWNER DECISION',
              'organization and persona model approved',
              'implementation bound to central SHA 6a24e57d75f17550fe0fd5755889aef9a5cacdc9'
            ],
            acceptance: [
              'legacy subscription, upgrade, agent-leasing and package-limit authority remains unreachable',
              'stored usage-meter limits are historical evidence only and do not block Runtime',
              'Branch to Department to Team to User Scope Assignment foundation is implemented',
              'every organization authority decision is deny-by-default and requires same-tenant exact scope',
              'role delegation ceilings and role-scope compatibility are enforced',
              'assignment revocation is authorized from the persisted target scope',
              'refund and discount approval fail closed without independent initiator evidence',
              'database triggers reject cross-tenant hierarchy, users, managers, assignments and audit actors',
              'authority audit is append-only',
              'focused, foundation, G5, G8, regression, TypeScript, dependency audit, Build and isolated recovery drill pass',
              'no migration execution, backfill, main or Production action occurred'
            ],
            vercelValidation: 'SKIP_BY_DEFAULT',
            vercelValidationRationale: 'The completed Runtime and authority changes were proven by exact-head GitHub CI, direct denial tests, TypeScript, production dependency audit, Build, isolated recovery drill and diff review. No browser-only behavior was introduced and no stable-head Preview was necessary.',
            subAuthorizations: {
              main: false,
              migrationData: false,
              migration: false,
              backfill: false,
              providerCredential: false,
              production: false
            },
            implementation: {
              branch: 'work/orca-exec-004-single-company-authority-20260726',
              baseCentralSha: '6a24e57d75f17550fe0fd5755889aef9a5cacdc9',
              finalHeadSha: 'd547caaeaa48de592229a51c5c252e32d4aacd02',
              scopeFiles: 15,
              migrationPrepared: true,
              migrationExecuted: false,
              backfillExecuted: false,
              runtimeDefectsRemaining: 0
            },
            closure: {
              pullRequest: 128,
              finalHeadSha: 'd547caaeaa48de592229a51c5c252e32d4aacd02',
              centralMergeSha: '8643f1858cd453c53bee60cc4184dfab2f7cebdb',
              orcaCi: 'SUCCESS',
              orcaCiRun: 512,
              workflowRunId: 30184825897,
              independentFinalReview: 'PASS',
              recoveryDrill: 'SUCCESS AFTER INFRASTRUCTURE-ONLY RETRY',
              vercelValidation: 'SKIP_BY_DEFAULT',
              scopeFiles: 15,
              mainAction: false,
              productionAction: false,
              migrationExecuted: false,
              backfillExecuted: false,
              customerDataAction: false,
              closedOn: '2026-07-26'
            }
          });

          const closed = registry.packages.filter((item) => item.state === 'CLOSED').length;
          const pending = registry.packages.filter((item) => item.state === 'OWNER_DECISION_PENDING').length;
          const inExecution = registry.packages.filter((item) => item.state === 'IN_EXECUTION').length;
          if (closed !== 4 || pending !== 7 || inExecution !== 0) {
            throw new Error(`Post-closure counts invalid: closed=${closed}, pending=${pending}, inExecution=${inExecution}`);
          }
          if (registry.summary.closed !== closed || registry.summary.ownerDecisionPending !== pending) {
            throw new Error('Registry summary does not match package states');
          }

          fs.writeFileSync(path, JSON.stringify(registry));
          NODE

      - name: Upload reconciled registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: exec-004-reconciled-registry
          path: docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit registry and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/exec-004-closure-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/zero-based/Z8/ORCA_Z8_EXECUTION_PACKAGE_REGISTRY.json .github/workflows/exec-004-closure-reconcile.yml
          git commit -m "docs(exec-004): reconcile closed package registry"
          git push origin HEAD:work/orca-exec-004-closure-20260726

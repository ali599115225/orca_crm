name: ORCA Security Lockfile Refresh

on:
  push:
    branches:
      - work/orca-security-advisory-20260724-z1-unblock
    paths:
      - package.json
      - .github/workflows/orca-security-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: orca-security-lockfile-refresh-20260724
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and verify package lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: work/orca-security-advisory-20260724-z1-unblock

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Show lockfile change
        run: git diff -- package-lock.json

      - name: Commit generated lockfile candidate
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh package lock candidate"
          git push origin HEAD:work/orca-security-advisory-20260724-z1-unblock

      - name: Verify clean install
        run: npm ci

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

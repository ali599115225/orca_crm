name: ORCA Lockfile Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh, verify, and commit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate
          npx prisma validate
          npx prisma generate

      - name: Commit refreshed lockfile
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(deps): refresh verified package lock"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: orca-refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

name: W1F Migration Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/w1f-migration-readiness.yml"
      - "docs/product-extension/W1F_MIGRATION_READINESS_GATE.md"
      - "scripts/w1f-migration-readiness-summary.mjs"
      - "tests/foundation/g8-w1f-migration-readiness.test.ts"
      - "prisma/migrations/20260815001500_w1_contract_finance_foundation/migration.sql"
      - "prisma/migrations/20260815004500_w1d_snapshot_offer_integrity/migration.sql"
      - "prisma/migrations/20260815010000_w1_schema_alignment/migration.sql"
      - "prisma/w1-contract-finance.prisma"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1f-migration-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRE_W1A_SHA: 50266d2122c966d0fa48f0d1b789e6ed5916b68c
  W1A_MIGRATION: prisma/migrations/20260815001500_w1_contract_finance_foundation/migration.sql
  W1D_MIGRATION: prisma/migrations/20260815004500_w1d_snapshot_offer_integrity/migration.sql
  W1_ALIGNMENT_MIGRATION: prisma/migrations/20260815010000_w1_schema_alignment/migration.sql
  POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_admin?sslmode=disable
  NODE_ENV: test

jobs:
  isolated-migration-rehearsal:
    name: PostgreSQL 16 isolated replay + W1 upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orca_w1f_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orca_w1f_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 0

      - name: Checkout exact pre-W1A reference
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRE_W1A_SHA }}
          path: prew1a
          fetch-depth: 1

      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: head/package-lock.json

      - name: Verify exact refs and PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C prew1a rev-parse HEAD)" = "$PRE_W1A_SHA"
          candidate="$(git -C head rev-parse HEAD)"
          event_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$candidate" = "$event_head"
          postgres_version="$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version_num' | xargs)"
          test "$postgres_version" -ge 160000 -a "$postgres_version" -lt 170000
          printf 'pre_w1a_sha=%s\nhead_sha=%s\nevent_head_sha=%s\nnode=%s\npostgres=%s\n' \
            "$PRE_W1A_SHA" "$candidate" "$event_head" "$(node --version)" \
            "$(psql "$POSTGRES_ADMIN_URL" -tAc 'SHOW server_version' | xargs)" \
            | tee evidence/environment.txt

      - name: Install candidate dependencies
        run: npm --prefix head ci

      - name: Validate frozen W1 artifacts and alignment scope
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const w1a = fs.readFileSync('head/prisma/migrations/20260815001500_w1_contract_finance_foundation/migration.sql', 'utf8');
          const w1d = fs.readFileSync('head/prisma/migrations/20260815004500_w1d_snapshot_offer_integrity/migration.sql', 'utf8');
          const alignment = fs.readFileSync('head/prisma/migrations/20260815010000_w1_schema_alignment/migration.sql', 'utf8');
          const w1Tables = new Set([
            'contract_amendments','contract_approvals','contract_clause_definitions','contract_drafts',
            'contract_snapshots','contract_template_versions','contract_templates','finance_case_events',
            'finance_cases','finance_provider_offers'
          ]);
          const stripComments = value => value.replace(/--.*$/gm, '');
          const statements = value => stripComments(value).split(';').map(statement => statement.trim()).filter(Boolean);
          const w1aStatements = statements(w1a);
          const w1dStatements = statements(w1d);
          const alignmentStatements = statements(alignment);
          const invalidW1a = w1aStatements.filter(statement => !/^CREATE\s+(?:TABLE|INDEX)\b/i.test(statement));
          const invalidW1d = w1dStatements.filter(statement => !/^CREATE\s+UNIQUE\s+INDEX\b/i.test(statement));
          if (invalidW1a.length) throw new Error(`W1F_W1A_NON_ADDITIVE_STATEMENT:${invalidW1a[0].slice(0,120)}`);
          if (invalidW1d.length) throw new Error(`W1F_W1D_NON_ADDITIVE_STATEMENT:${invalidW1d[0].slice(0,120)}`);
          const alignmentTables = [];
          for (const statement of alignmentStatements) {
            const match = statement.match(/^ALTER\s+TABLE\s+"([^"]+)"\s+/i);
            if (!match || !w1Tables.has(match[1])) throw new Error(`W1F_ALIGNMENT_SCOPE_INVALID:${statement.slice(0,120)}`);
            alignmentTables.push(match[1]);
            if (!(/\bALTER\s+COLUMN\b/i.test(statement) || /\bRENAME\s+CONSTRAINT\b/i.test(statement))) {
              throw new Error(`W1F_ALIGNMENT_OPERATION_INVALID:${statement.slice(0,120)}`);
            }
            if (/\b(?:INSERT|UPDATE|DELETE|TRUNCATE|DROP)\b/i.test(statement)) {
              throw new Error(`W1F_ALIGNMENT_DML_OR_DROP_FORBIDDEN:${statement.slice(0,120)}`);
            }
          }
          const tableCount = w1aStatements.filter(statement => /^CREATE\s+TABLE\b/i.test(statement)).length;
          const indexCount = w1aStatements.filter(statement => /^CREATE\s+INDEX\b/i.test(statement)).length;
          const uniqueIndexCount = w1dStatements.filter(statement => /^CREATE\s+UNIQUE\s+INDEX\b/i.test(statement)).length;
          if (tableCount !== 10) throw new Error(`W1F_W1A_TABLE_COUNT:${tableCount}`);
          if (uniqueIndexCount !== 2) throw new Error(`W1F_W1D_UNIQUE_INDEX_COUNT:${uniqueIndexCount}`);
          if (alignmentStatements.length !== 21) throw new Error(`W1F_ALIGNMENT_STATEMENT_COUNT:${alignmentStatements.length}`);
          fs.writeFileSync('evidence/static-artifacts.json', JSON.stringify({
            tableCount,indexCount,uniqueIndexCount,alignmentStatementCount:alignmentStatements.length,
            alignmentTables:[...new Set(alignmentTables)].sort(),verdict:'PASS'
          }, null, 2) + '\n');
          NODE

      - name: Create isolated rehearsal databases
        shell: bash
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres orca_w1f_replay
          createdb -h 127.0.0.1 -U postgres orca_w1f_upgrade

      - name: Full migration-history replay with frozen historical exception handling
        shell: bash
        run: |
          set -euo pipefail
          W1F_REPLAY_URL='postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_replay?sslmode=disable' \
          W1F_HEAD_DIR=head \
          W1F_EVIDENCE_DIR=evidence \
            node head/scripts/w1f-migration-readiness-summary.mjs full-replay

      - name: Materialize exact pre-W1A supported schema
        shell: bash
        run: |
          set -euo pipefail
          UPGRADE_URL='postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_upgrade?sslmode=disable'
          attempt=1
          while [ "$attempt" -le 5 ]; do
            set +e
            materialize_output="$(
              DATABASE_URL="$UPGRADE_URL" \
              DIRECT_URL="$UPGRADE_URL" \
              W1F_HEAD_DIR=head \
              W1F_PRE_W1A_SCHEMA=prew1a/prisma/schema.prisma \
              W1F_OUTPUT=evidence/pre-w1a-schema.sql \
                node head/scripts/w1f-migration-readiness-summary.mjs materialize-prew1a 2>&1
            )"
            materialize_code=$?
            set -e
            printf '%s\n' "$materialize_output" > "evidence/pre-w1a-materialize-attempt-${attempt}.txt"
            if [ "$materialize_code" -eq 0 ]; then
              break
            fi
            if ! grep -Fq 'Error in Schema engine' <<< "$materialize_output"; then
              printf '%s\n' "$materialize_output"
              exit "$materialize_code"
            fi
            if [ "$attempt" -eq 5 ]; then
              printf '%s\n' "$materialize_output"
              exit "$materialize_code"
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          printf '{"attempts":%s,"verdict":"PASS"}\n' "$attempt" > evidence/pre-w1a-materialize-retry-summary.json
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f evidence/pre-w1a-schema.sql \
            > evidence/pre-w1a-apply.txt
          DATABASE_URL="$UPGRADE_URL" \
            W1F_OUTPUT=evidence/legacy-before.json \
            node head/scripts/w1f-migration-readiness-summary.mjs capture-legacy \
            > evidence/legacy-before-summary.txt

      - name: Apply W1A, W1D, and W1 schema alignment to isolated upgrade database
        shell: bash
        run: |
          set -euo pipefail
          UPGRADE_URL='postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_upgrade?sslmode=disable'
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "head/$W1A_MIGRATION" \
            > evidence/w1a-upgrade-apply.txt
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "head/$W1D_MIGRATION" \
            > evidence/w1d-upgrade-apply.txt
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 -f "head/$W1_ALIGNMENT_MIGRATION" \
            > evidence/w1-alignment-upgrade-apply.txt
          W1F_UPGRADE_URL="$UPGRADE_URL" \
          W1F_HEAD_DIR=head \
          W1F_OUTPUT=evidence/targeted-upgrade-drift.txt \
            node head/scripts/w1f-migration-readiness-summary.mjs targeted-drift

      - name: Verify migration evidence and legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          W1F_REPLAY_URL='postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_replay?sslmode=disable' \
          W1F_UPGRADE_URL='postgresql://postgres:postgres@127.0.0.1:5432/orca_w1f_upgrade?sslmode=disable' \
          W1F_LEGACY_BEFORE_PATH=evidence/legacy-before.json \
          W1F_REPLAY_DRIFT_CLASSIFICATION_PATH=evidence/full-replay-drift-classification.json \
          W1F_OUTPUT=evidence/w1f-summary.json \
          W1F_PRE_W1A_SHA="$PRE_W1A_SHA" \
          W1F_HEAD_SHA="$(git -C head rev-parse HEAD)" \
            node head/scripts/w1f-migration-readiness-summary.mjs summarize \
            | tee evidence/w1f-summary-line.txt

      - name: W1F executable contract test
        working-directory: head
        run: |
          npx vitest run tests/foundation/g8-w1f-migration-readiness.test.ts \
            --reporter=json --outputFile=../evidence/w1f-g8-test-results.json

      - name: Cleanup isolated databases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for db in orca_w1f_replay orca_w1f_upgrade; do
            psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='$db' AND pid <> pg_backend_pid()" \
              >/dev/null || true
            dropdb -h 127.0.0.1 -U postgres --if-exists "$db"
          done
          printf '%s\n' '{"verdict":"PASS","isolatedDatabasesRemaining":0}' \
            > evidence/cleanup.json

      - name: Upload W1F migration readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1f-migration-readiness-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
